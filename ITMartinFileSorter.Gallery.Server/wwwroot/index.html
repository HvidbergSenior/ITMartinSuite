<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Galleri</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0d14;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* Header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,13,20,.97);border-bottom:1px solid #1f2937;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hdr-title{font-size:17px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-btn{background:#1f2937;border:none;color:#9ca3af;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.hdr-btn:hover{color:#f0f0f0}

/* Content */
.content{padding:14px 14px 80px}
.section-label{font-size:11px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 10px}

/* Gallery picker */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
.gallery-card{background:#111827;border:1px solid #1f2937;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .1s}
.gallery-card:active{border-color:#3b82f6;transform:scale(.97)}
.gallery-card-cover{width:100%;aspect-ratio:1;object-fit:cover;background:#0a0d14;display:flex;align-items:center;justify-content:center;font-size:48px;color:#374151}
.gallery-card-cover img{width:100%;height:100%;object-fit:cover}
.gallery-card-info{padding:10px 12px}
.gallery-card-name{font-size:15px;font-weight:700}

/* Folder grid */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.folder-card{background:#111827;border:1px solid #1f2937;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.folder-card:active{border-color:#3b82f6}
.folder-cover{width:100%;aspect-ratio:1;object-fit:cover;background:#0a0d14;display:flex;align-items:center;justify-content:center;font-size:32px;color:#374151}
.folder-cover img{width:100%;height:100%;object-fit:cover}
.folder-info{padding:8px 10px}
.folder-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* File grid */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.file-card{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;background:#111827}
.file-card:active{opacity:.8}
.file-thumb{width:100%;height:100%;object-fit:cover}
.file-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.vid-overlay{background:rgba(0,0,0,.4)}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#4b5563;font-size:15px}

/* ── VIEWER ─────────────────── */
#viewer{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#viewer.active{display:flex}
.v-hdr{position:absolute;top:0;left:0;right:0;z-index:10;padding:10px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(#000a,transparent)}
.v-title{flex:1;font-size:13px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.v-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.v-media{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.v-audio-bg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#9ca3af}
.v-audio-icon{font-size:64px}
.v-zone{position:absolute;top:0;bottom:0;width:40%;cursor:pointer}
.v-zone.left{left:0}
.v-zone.right{right:0}
.v-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:none}
.v-arrow.left{left:10px}
.v-arrow.right{right:10px}
.v-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:rgba(255,255,255,.6);font-size:12px;padding:4px 10px;border-radius:999px}
</style>
</head>
<body>

<!-- Browse / home view -->
<div id="browse">
  <div class="hdr">
    <button class="hdr-btn" id="btnGalleries" style="display:none">🏠 Gallerier</button>
    <button class="hdr-btn" id="btnBack" style="display:none">← Tilbage</button>
    <div class="hdr-title" id="hdrTitle">🖼️ Gallerier</div>
  </div>
  <div class="content">
    <!-- Gallery picker (shown when no gallery selected) -->
    <div id="galleryPicker">
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
    <!-- File browser (shown when inside a gallery) -->
    <div id="fileBrowser" style="display:none">
      <div id="folderSection">
        <div class="section-label">Mapper</div>
        <div class="folder-grid" id="folderGrid"></div>
      </div>
      <div id="fileSection">
        <div class="section-label">Billeder &amp; videoer</div>
        <div class="file-grid" id="fileGrid"></div>
      </div>
      <div class="empty" id="emptyState" style="display:none">Ingen mediefiler her</div>
    </div>
  </div>
</div>

<!-- Viewer -->
<div id="viewer">
  <div class="v-hdr">
    <button class="v-btn" onclick="closeViewer()">📁 Mappe</button>
    <button class="v-btn" onclick="goHome()">🏠</button>
    <div class="v-title" id="vTitle"></div>
  </div>
  <div class="v-stage" id="vStage">
    <div class="v-zone left"  onclick="viewerNav(-1)"></div>
    <div class="v-zone right" onclick="viewerNav(1)"></div>
    <div class="v-arrow left">❮</div>
    <div class="v-arrow right">❯</div>
    <div class="v-counter" id="vCounter"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let currentGallery = null;   // null = home screen
let currentRelPath = '';
let parentRelPath  = null;
let playlist       = [];
let playIdx        = 0;

// ── Init ──────────────────────────────────────────────────────────────────────
loadGalleries();

// ── Gallery picker ────────────────────────────────────────────────────────────
async function loadGalleries() {
  currentGallery = null;
  const res = await fetch('/api/galleries');
  if (!res.ok) return;
  const list = await res.json();

  document.getElementById('galleryPicker').style.display = '';
  document.getElementById('fileBrowser').style.display   = 'none';
  document.getElementById('btnGalleries').style.display  = 'none';
  document.getElementById('btnBack').style.display       = 'none';
  document.getElementById('hdrTitle').textContent        = '🖼️ Gallerier';

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = list.map(g => `
    <div class="gallery-card" onclick="selectGallery('${esc(g.slug)}','${esc(g.name)}')">
      <div class="gallery-card-cover">🖼️</div>
      <div class="gallery-card-info">
        <div class="gallery-card-name">${esc(g.name)}</div>
      </div>
    </div>`).join('');
}

function selectGallery(slug, name) {
  currentGallery = slug;
  document.getElementById('galleryPicker').style.display = 'none';
  document.getElementById('fileBrowser').style.display   = '';
  loadBrowse('', name);
}

// ── Browse ────────────────────────────────────────────────────────────────────
async function loadBrowse(relPath, galleryName) {
  if (!currentGallery) return;
  currentRelPath = relPath ?? '';
  const url = `/api/browse?gallery=${encodeURIComponent(currentGallery)}` +
              (relPath ? `&path=${encodeURIComponent(relPath)}` : '');
  const res = await fetch(url);
  if (!res.ok) return;
  const data = await res.json();
  parentRelPath = data.parentRelPath;
  renderBrowse(data, galleryName);
}

function renderBrowse(data, galleryName) {
  const { atRoot, folders, files } = data;

  // Header
  const title = atRoot
    ? (galleryName || currentGallery)
    : currentRelPath.split('/').pop();
  document.getElementById('hdrTitle').textContent        = title;
  document.getElementById('btnGalleries').style.display  = '';
  document.getElementById('btnBack').style.display       = atRoot ? 'none' : '';

  // Folders
  const fg = document.getElementById('folderGrid');
  const fs = document.getElementById('folderSection');
  if (folders.length) {
    fs.style.display = '';
    fg.innerHTML = folders.map(f => `
      <div class="folder-card" onclick="loadBrowse('${esc(f.relPath)}')">
        <div class="folder-cover">
          ${f.cover ? `<img src="${esc(f.cover)}" loading="lazy" onerror="this.parentElement.innerHTML='📁'" alt="">` : '📁'}
        </div>
        <div class="folder-info">
          <div class="folder-name">${esc(f.name)}</div>
        </div>
      </div>`).join('');
  } else {
    fs.style.display = 'none';
  }

  // Files
  const fg2 = document.getElementById('fileGrid');
  const fs2 = document.getElementById('fileSection');
  if (files.length) {
    fs2.style.display = '';
    fg2.innerHTML = files.map((f, i) => {
      if (f.isVideo) return `
        <div class="file-card" onclick="openViewer(${i})">
          <div class="file-overlay vid-overlay">▶</div>
        </div>`;
      if (f.isAudio) return `
        <div class="file-card" onclick="openViewer(${i})">
          <div class="file-overlay">🎵</div>
        </div>`;
      return `
        <div class="file-card" onclick="openViewer(${i})">
          <img class="file-thumb" src="${esc(f.thumb ?? f.webPath)}" loading="lazy"
               onerror="this.style.display='none';this.parentElement.querySelector('.file-overlay')||this.insertAdjacentHTML('afterend','<div class=file-overlay>🖼️</div>')" alt="">
        </div>`;
    }).join('');
    playlist = files;
  } else {
    fs2.style.display = 'none';
  }

  document.getElementById('emptyState').style.display =
    (!folders.length && !files.length) ? '' : 'none';
}

// ── Viewer ────────────────────────────────────────────────────────────────────
async function openViewer(idx) {
  const url = `/api/playlist?gallery=${encodeURIComponent(currentGallery)}` +
              `&folder=${encodeURIComponent(currentRelPath || '.')}`;
  const res = await fetch(url);
  if (res.ok) {
    const data = await res.json();
    playlist = data.files;
  }
  playIdx = idx;
  document.getElementById('viewer').classList.add('active');
  renderViewer();
  document.addEventListener('keydown', onKey);
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('active');
  document.removeEventListener('keydown', onKey);
  const stage = document.getElementById('vStage');
  const media = stage.querySelector('video,audio');
  if (media) { media.pause(); media.src = ''; }
}

function goHome() { closeViewer(); loadGalleries(); }

function renderViewer() {
  if (!playlist.length) return;
  const f = playlist[playIdx];

  document.getElementById('vTitle').textContent   = f.name;
  document.getElementById('vCounter').textContent = `${playIdx + 1} / ${playlist.length}`;

  const stage = document.getElementById('vStage');
  const old   = stage.querySelector('.v-media, .v-audio-bg');
  if (old) old.remove();

  let el;
  if (f.isVideo) {
    el = document.createElement('video');
    el.className   = 'v-media';
    el.controls    = true;
    el.autoplay    = true;
    el.playsinline = true;
    el.preload     = 'metadata';
    el.src         = f.webPath;
    el.onclick     = e => e.stopPropagation();
  } else if (f.isAudio) {
    el = document.createElement('div');
    el.className = 'v-audio-bg';
    el.innerHTML = `<div class="v-audio-icon">🎵</div><div style="font-size:14px;color:#9ca3af">${esc(f.name)}</div><audio controls autoplay style="margin-top:8px;width:260px" src="${esc(f.webPath)}"></audio>`;
  } else {
    el = document.createElement('img');
    el.className = 'v-media';
    el.alt       = f.name;
    el.src       = f.webPath;
    el.onclick   = () => viewerNav(1);
  }

  stage.insertBefore(el, stage.querySelector('.v-zone.left'));
}

function viewerNav(delta) {
  if (!playlist.length) return;
  const stage = document.getElementById('vStage');
  const media = stage.querySelector('video, audio');
  if (media) { media.pause(); media.src = ''; }
  playIdx = ((playIdx + delta) + playlist.length) % playlist.length;
  renderViewer();
}

function onKey(e) {
  if (e.key === 'ArrowRight') viewerNav(1);
  if (e.key === 'ArrowLeft')  viewerNav(-1);
  if (e.key === 'Escape')     closeViewer();
}

// ── Navigation buttons ────────────────────────────────────────────────────────
document.getElementById('btnBack').addEventListener('click', () => loadBrowse(parentRelPath ?? ''));
document.getElementById('btnGalleries').addEventListener('click', () => loadGalleries());

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
