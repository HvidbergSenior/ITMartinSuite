<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Galleri</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0d14;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* Header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,13,20,.97);border-bottom:1px solid #1f2937;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hdr-title{font-size:17px;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-btn{background:#1f2937;border:none;color:#9ca3af;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.hdr-btn:hover{color:#f0f0f0}

/* Content */
.content{padding:14px 14px 80px}
.section-label{font-size:11px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 10px}

/* Gallery picker */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:16px}
.gallery-card{background:#111827;border:1px solid #1f2937;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .1s}
.gallery-card:active{border-color:#3b82f6;transform:scale(.97)}
.gallery-card-cover{width:100%;aspect-ratio:1;object-fit:cover;background:#0a0d14;display:flex;align-items:center;justify-content:center;font-size:48px;color:#374151}
.gallery-card-cover img{width:100%;height:100%;object-fit:cover}
.gallery-card-info{padding:10px 12px}
.gallery-card-name{font-size:15px;font-weight:700}

/* Welcome summary */
.summary-card{background:linear-gradient(135deg,#1e3a5f,#0f2942);border:1px solid #2d5a8f;border-radius:16px;padding:24px 20px;margin-bottom:18px;text-align:center}
.summary-icon{font-size:40px;margin-bottom:8px}
.summary-title{font-size:19px;font-weight:800;margin-bottom:4px}
.summary-sub{font-size:13px;color:#93c5fd;margin-bottom:16px}
.summary-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:20px 28px}
.summary-stat{display:flex;flex-direction:column;gap:2px}
.summary-stat-num{font-size:24px;font-weight:900;color:#60a5fa}
.summary-stat-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}

/* Folder grid */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:6px}
.folder-card{background:#111827;border:1px solid #1f2937;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.folder-card:active{border-color:#3b82f6}
.folder-cover{width:100%;aspect-ratio:1;object-fit:cover;background:#0a0d14;display:flex;align-items:center;justify-content:center;font-size:32px;color:#374151}
.folder-cover img{width:100%;height:100%;object-fit:cover}
.folder-info{padding:8px 10px}
.folder-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Collections row */
.collection-sub{font-size:12px;color:#6b7280;margin:-6px 0 10px;line-height:1.4}
.collection-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#c4b5fd;background:#2e1f5e;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:6px}
.collection-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.collection-row::-webkit-scrollbar{display:none}
.collection-card{flex:0 0 128px;background:#111827;border:1px solid #1f2937;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.collection-card:active{border-color:#8b5cf6}
.collection-cover{width:128px;height:128px;object-fit:cover;background:#0a0d14;display:flex;align-items:center;justify-content:center;font-size:32px;color:#374151}
.collection-cover img{width:100%;height:100%;object-fit:cover}
.collection-info{padding:8px 10px}
.collection-name{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collection-count{font-size:11px;color:#6b7280;margin-top:1px}

/* File grid */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.file-card{aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;background:#111827}
.file-card:active{opacity:.8}
.file-thumb{width:100%;height:100%;object-fit:cover}
.file-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.vid-overlay{background:rgba(0,0,0,.4)}
.file-tv{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;z-index:2;text-decoration:none;line-height:1.5}
.file-live-badge{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:800;letter-spacing:.03em;z-index:2;display:flex;align-items:center;gap:3px;pointer-events:none}
.file-live-badge .dot{width:6px;height:6px;border-radius:50%;background:#fbbf24}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:#4b5563;font-size:15px}

/* ── LOGIN MODAL ─────────────── */
#loginModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center}
#loginModal.active{display:flex}
.login-box{background:#111827;border:1px solid #1f2937;border-radius:18px;padding:32px 28px;width:min(340px,90vw);display:flex;flex-direction:column;gap:16px}
.login-title{font-size:20px;font-weight:800;text-align:center}
.login-sub{font-size:14px;color:#6b7280;text-align:center}
.login-input{background:#0a0d14;border:1px solid #374151;border-radius:10px;color:#f0f0f0;font-size:16px;padding:12px 14px;width:100%;outline:none}
.login-input:focus{border-color:#3b82f6}
.login-error{color:#ef4444;font-size:13px;text-align:center;min-height:18px}
.login-btn{background:#3b82f6;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;padding:13px;cursor:pointer;width:100%}
.login-btn:active{background:#2563eb}
.login-cancel{background:none;border:none;color:#6b7280;font-size:14px;cursor:pointer;text-align:center;padding:4px}
.login-cancel:hover{color:#9ca3af}

/* ── VIEWER ─────────────────── */
#viewer{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column}
#viewer.active{display:flex}
.v-hdr{position:absolute;top:0;left:0;right:0;z-index:10;padding:10px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(#000a,transparent)}
.v-title{flex:1;font-size:13px;color:rgba(255,255,255,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-btn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
.v-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.v-media{max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.v-live-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;display:flex;align-items:center;gap:6px;pointer-events:none;z-index:5;transition:opacity .15s}
.v-live-hint .dot{width:7px;height:7px;border-radius:50%;background:#fbbf24}
.v-live-hint.playing{opacity:0}
.v-audio-bg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#9ca3af}
.v-audio-icon{font-size:64px}
.v-zone{position:absolute;top:0;bottom:0;width:40%;cursor:pointer}
.v-zone.left{left:0}
.v-zone.right{right:0}
.v-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.4);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;pointer-events:none}
.v-arrow.left{left:10px}
.v-arrow.right{right:10px}
.v-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:rgba(255,255,255,.6);font-size:12px;padding:4px 10px;border-radius:999px}
</style>
</head>
<body>

<!-- Browse / home view -->
<div id="browse">
  <div class="hdr">
    <button class="hdr-btn" id="btnGalleries" style="display:none">🏠 Gallerier</button>
    <button class="hdr-btn" id="btnBack" style="display:none">← Tilbage</button>
    <div class="hdr-title" id="hdrTitle">🖼️ Gallerier</div>
    <button class="hdr-btn" id="btnLogout" style="display:none">Log ud</button>
  </div>
  <div class="content">
    <div id="galleryPicker">
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
    <div id="fileBrowser" style="display:none">
      <div class="summary-card" id="summaryCard" style="display:none">
        <div class="summary-icon">🎉</div>
        <div class="summary-title">Din samling er klar!</div>
        <div class="summary-stats" id="summaryStats"></div>
      </div>
      <div id="collectionsSection" style="display:none">
        <div class="section-label">Samlinger<span class="collection-badge">Eksempel</span></div>
        <div class="collection-sub">Fundet automatisk (ansigter, sted &amp; år) — smagsprøve på, hvad der kan bygges videre til hele biblioteket.</div>
        <div class="collection-row" id="collectionRow"></div>
      </div>
      <div id="folderSection">
        <div class="section-label">Mapper</div>
        <div class="folder-grid" id="folderGrid"></div>
      </div>
      <div id="fileSection">
        <div class="section-label">Billeder &amp; videoer</div>
        <div class="file-grid" id="fileGrid"></div>
      </div>
      <div class="empty" id="emptyState" style="display:none">Ingen mediefiler her</div>
    </div>
  </div>
</div>

<!-- Login modal -->
<div id="loginModal">
  <div class="login-box">
    <div class="login-title" id="loginTitle">🔒 Log ind</div>
    <div class="login-sub" id="loginSub">Indtast adgangskode</div>
    <input class="login-input" id="loginInput" type="password" placeholder="Adgangskode" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn">Åbn galleri</button>
    <button class="login-cancel" id="loginCancel">Annuller</button>
  </div>
</div>

<!-- Viewer -->
<div id="viewer">
  <div class="v-hdr">
    <button class="v-btn" onclick="closeViewer()">📁 Mappe</button>
    <button class="v-btn" onclick="goHome()">🏠</button>
    <div class="v-title" id="vTitle"></div>
    <a class="v-btn" id="vTvBtn" style="display:none;text-decoration:none" target="_blank" title="Åbn i native afspiller (AirPlay)">📺</a>
  </div>
  <div class="v-stage" id="vStage">
    <div class="v-zone left"  onclick="viewerNav(-1)"></div>
    <div class="v-zone right" onclick="viewerNav(1)"></div>
    <div class="v-arrow left">❮</div>
    <div class="v-arrow right">❯</div>
    <div class="v-counter" id="vCounter"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let currentGallery = null;
let currentRelPath = '';
let parentRelPath  = null;
let playlist       = [];
let playIdx        = 0;
let pendingSlug    = null;
let pendingName    = null;
let summaryData    = null;
let collectionsData    = null;
let viewingCollection  = null;
let galleryDisplayName = null;

// ── Init ──────────────────────────────────────────────────────────────────────
loadGalleries();

// ── Gallery picker ────────────────────────────────────────────────────────────
async function loadGalleries() {
  currentGallery = null;
  summaryData    = null;
  collectionsData    = null;
  viewingCollection  = null;
  const res = await fetch('/api/galleries');
  if (!res.ok) return;
  const list = await res.json();

  document.getElementById('galleryPicker').style.display = '';
  document.getElementById('fileBrowser').style.display   = 'none';
  document.getElementById('btnGalleries').style.display  = 'none';
  document.getElementById('btnBack').style.display       = 'none';
  document.getElementById('btnLogout').style.display     = 'none';
  document.getElementById('hdrTitle').textContent        = '🖼️ Gallerier';

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = list.map(g => `
    <div class="gallery-card" onclick="selectGallery('${esc(g.slug)}','${esc(g.name)}')">
      <div class="gallery-card-cover">🖼️</div>
      <div class="gallery-card-info">
        <div class="gallery-card-name">${esc(g.name)}</div>
      </div>
    </div>`).join('');
}

async function selectGallery(slug, name) {
  // Try to browse — if 401 show login, else enter
  const res = await fetch(`/api/browse?gallery=${encodeURIComponent(slug)}`);
  if (res.status === 401) {
    showLogin(slug, name);
    return;
  }
  if (!res.ok) return;
  currentGallery = slug;
  galleryDisplayName = name;
  document.getElementById('galleryPicker').style.display = 'none';
  document.getElementById('fileBrowser').style.display   = '';
  document.getElementById('btnLogout').style.display     = '';
  const data = await res.json();
  parentRelPath = data.parentRelPath;
  renderBrowse(data, name);
  loadSummary(slug);
  loadCollections(slug);
}

// ── Login ─────────────────────────────────────────────────────────────────────
function showLogin(slug, name) {
  pendingSlug = slug;
  pendingName = name;
  document.getElementById('loginTitle').textContent = '🔒 ' + name;
  document.getElementById('loginInput').value = '';
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginModal').classList.add('active');
  setTimeout(() => document.getElementById('loginInput').focus(), 100);
}

function hideLogin() {
  document.getElementById('loginModal').classList.remove('active');
  pendingSlug = null;
  pendingName = null;
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginCancel').addEventListener('click', hideLogin);

async function doLogin() {
  const pw  = document.getElementById('loginInput').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  const res = await fetch('/api/login', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ gallery: pendingSlug, password: pw }),
  });
  if (res.ok) {
    const slug = pendingSlug, name = pendingName;
    hideLogin();
    currentGallery = slug;
    galleryDisplayName = name;
    document.getElementById('galleryPicker').style.display = 'none';
    document.getElementById('fileBrowser').style.display   = '';
    document.getElementById('btnLogout').style.display     = '';
    await loadBrowse('', name);
    loadSummary(slug);
    loadCollections(slug);
  } else {
    err.textContent = 'Forkert adgangskode';
    document.getElementById('loginInput').select();
  }
}

// ── Logout ────────────────────────────────────────────────────────────────────
document.getElementById('btnLogout').addEventListener('click', async () => {
  if (currentGallery) {
    await fetch(`/api/logout?gallery=${encodeURIComponent(currentGallery)}`, { method: 'POST' });
  }
  loadGalleries();
});

// ── Browse ────────────────────────────────────────────────────────────────────
// titleOverride: the friendly name shown on the folder card that was clicked
// (e.g. "Billeder") - used verbatim as the header once inside that folder,
// since the API only translates folder names at the library root and a
// nested path segment (e.g. "Images") would otherwise show up untranslated.
async function loadBrowse(relPath, titleOverride) {
  if (!currentGallery) return;
  viewingCollection = null;
  document.getElementById('folderSection').style.display = '';
  currentRelPath = relPath ?? '';
  const url = `/api/browse?gallery=${encodeURIComponent(currentGallery)}` +
              (relPath ? `&path=${encodeURIComponent(relPath)}` : '');
  const res = await fetch(url);
  if (res.status === 401) { loadGalleries(); return; }
  if (!res.ok) return;
  const data = await res.json();
  parentRelPath = data.parentRelPath;
  renderBrowse(data, titleOverride);
}

function renderBrowse(data, titleOverride) {
  const { atRoot, folders, files } = data;

  const title = atRoot
    ? (galleryDisplayName || currentGallery)
    : (titleOverride || currentRelPath.split('/').pop());
  document.getElementById('hdrTitle').textContent       = title;
  document.getElementById('btnGalleries').style.display = '';
  document.getElementById('btnBack').style.display      = atRoot ? 'none' : '';
  document.getElementById('summaryCard').style.display  = (atRoot && summaryData) ? '' : 'none';

  const fg = document.getElementById('folderGrid');
  const fs = document.getElementById('folderSection');
  if (folders.length) {
    fs.style.display = '';
    fg.innerHTML = folders.map(f => `
      <div class="folder-card" onclick="loadBrowse('${esc(f.relPath)}','${esc(f.name)}')">
        <div class="folder-cover">
          ${f.cover ? `<img src="${esc(f.cover)}" loading="lazy" onerror="this.parentElement.innerHTML='📁'" alt="">` : '📁'}
        </div>
        <div class="folder-info">
          <div class="folder-name">${esc(f.name)}</div>
        </div>
      </div>`).join('');
  } else {
    fs.style.display = 'none';
  }

  renderFileGrid(files);

  document.getElementById('collectionsSection').style.display =
    (atRoot && !viewingCollection && collectionsData && collectionsData.length) ? '' : 'none';

  document.getElementById('emptyState').style.display =
    (!folders.length && !files.length) ? '' : 'none';
}

function renderFileGrid(files) {
  const fg2 = document.getElementById('fileGrid');
  const fs2 = document.getElementById('fileSection');
  if (files.length) {
    fs2.style.display = '';
    fg2.innerHTML = files.map((f, i) => {
      if (f.isVideo) return `
        <div class="file-card" onclick="openViewer(${i})">
          <div class="file-overlay vid-overlay">▶</div>
          <a class="file-tv" href="${esc(tvUrl(f.webPath))}" target="_blank" onclick="event.stopPropagation()" title="Åbn direkte (AirPlay)">📺</a>
        </div>`;
      if (f.isAudio) return `
        <div class="file-card" onclick="openViewer(${i})">
          <div class="file-overlay">🎵</div>
          <a class="file-tv" href="${esc(tvUrl(f.webPath))}" target="_blank" onclick="event.stopPropagation()" title="Åbn direkte (AirPlay)">📺</a>
        </div>`;
      return `
        <div class="file-card" onclick="openViewer(${i})">
          ${f.liveVideo ? '<div class="file-live-badge"><span class="dot"></span>LIVE</div>' : ''}
          <img class="file-thumb" src="${esc(f.thumb ?? f.webPath)}" loading="lazy"
               onerror="this.style.display='none';this.parentElement.querySelector('.file-overlay')||this.insertAdjacentHTML('afterend','<div class=file-overlay>🖼️</div>')" alt="">
        </div>`;
    }).join('');
    playlist = files;
  } else {
    fs2.style.display = 'none';
  }
}

// ── Collections (Package3: person/trip albums) ───────────────────────────────
async function loadCollections(slug) {
  collectionsData = null;
  const res = await fetch(`/api/collections?gallery=${encodeURIComponent(slug)}`);
  if (!res.ok) return;
  const data = await res.json();
  collectionsData = data.collections || [];
  renderCollections();
  if (currentRelPath === '' && !viewingCollection) {
    document.getElementById('collectionsSection').style.display = collectionsData.length ? '' : 'none';
  }
}

function renderCollections() {
  if (!collectionsData) return;
  const row = document.getElementById('collectionRow');
  row.innerHTML = collectionsData.map(c => `
    <div class="collection-card" onclick="openCollection('${esc(c.name)}')">
      <div class="collection-cover">
        ${c.cover ? `<img src="${esc(c.cover)}" loading="lazy" onerror="this.parentElement.innerHTML='🗂️'" alt="">` : '🗂️'}
      </div>
      <div class="collection-info">
        <div class="collection-name">${esc(c.name)}</div>
        <div class="collection-count">${c.fileCount} filer</div>
      </div>
    </div>`).join('');
}

async function openCollection(name) {
  const url = `/api/collections/files?gallery=${encodeURIComponent(currentGallery)}&name=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if (!res.ok) return;
  const data = await res.json();

  viewingCollection = name;
  document.getElementById('hdrTitle').textContent      = name;
  document.getElementById('btnGalleries').style.display = '';
  document.getElementById('btnBack').style.display      = '';
  document.getElementById('summaryCard').style.display  = 'none';
  document.getElementById('collectionsSection').style.display = 'none';
  document.getElementById('folderSection').style.display = 'none';

  renderFileGrid(data.files);
  document.getElementById('emptyState').style.display = data.files.length ? 'none' : '';
}

// ── Welcome summary ───────────────────────────────────────────────────────────
async function loadSummary(slug) {
  summaryData = null;
  const res = await fetch(`/api/summary?gallery=${encodeURIComponent(slug)}`);
  if (!res.ok) return;
  summaryData = await res.json();
  renderSummary();
  // Re-show the card now that data is ready, if we're still at the gallery root
  if (currentRelPath === '') document.getElementById('summaryCard').style.display = '';
}

function renderSummary() {
  if (!summaryData) return;
  const s = summaryData;

  const stats = [];
  if (s.photoCount) stats.push([s.photoCount.toLocaleString('da-DK'), 'Billeder']);
  if (s.videoCount) stats.push([s.videoCount.toLocaleString('da-DK'), 'Videoer']);
  if (s.audioCount) stats.push([s.audioCount.toLocaleString('da-DK'), 'Lyd']);
  stats.push([s.folderCount.toLocaleString('da-DK'), 'Album']);
  if (s.totalGb) stats.push([s.totalGb.toLocaleString('da-DK') + ' GB', 'Størrelse']);

  document.getElementById('summaryStats').innerHTML = stats.map(([num, label]) => `
    <div class="summary-stat">
      <div class="summary-stat-num">${esc(num)}</div>
      <div class="summary-stat-label">${esc(label)}</div>
    </div>`).join('');
}

// ── Viewer ────────────────────────────────────────────────────────────────────
// `playlist` is already set by renderFileGrid() - whichever view is currently
// open (a folder via renderBrowse, or a Samlinger collection via openCollection)
// - re-fetching here by currentRelPath used to silently replace it with the
// current *folder*'s files even when viewing a collection (currentRelPath
// stays '' while viewingCollection is set), so next/prev inside a collection
// would jump to unrelated root-level photos instead of staying within it.
function openViewer(idx) {
  playIdx = idx;
  document.getElementById('viewer').classList.add('active');
  renderViewer();
  document.addEventListener('keydown', onKey);
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('active');
  document.removeEventListener('keydown', onKey);
  const stage = document.getElementById('vStage');
  const media = stage.querySelector('video,audio');
  if (media) { media.pause(); media.src = ''; }
}

function goHome() { closeViewer(); loadGalleries(); }

function renderViewer() {
  if (!playlist.length) return;
  const f = playlist[playIdx];

  document.getElementById('vTitle').textContent   = f.name.replace(/\.[^.]+$/, '');
  document.getElementById('vCounter').textContent = `${playIdx + 1} / ${playlist.length}`;

  const tvBtn = document.getElementById('vTvBtn');
  if (f.isVideo || f.isAudio) {
    tvBtn.href           = tvUrl(f.webPath);
    tvBtn.style.display  = '';
  } else {
    tvBtn.style.display = 'none';
  }

  const stage = document.getElementById('vStage');
  const old   = stage.querySelector('.v-media, .v-audio-bg');
  if (old) old.remove();

  let el;
  if (f.isVideo) {
    el = document.createElement('video');
    el.className   = 'v-media';
    el.controls    = true;
    el.autoplay    = true;
    el.playsinline = true;
    el.preload     = 'metadata';
    el.setAttribute('x-webkit-airplay', 'allow');
    el.src         = f.webPath;
    el.onclick     = e => e.stopPropagation();
  } else if (f.isAudio) {
    el = document.createElement('div');
    el.className = 'v-audio-bg';
    const shortName = f.name.replace(/\.[^.]+$/, '');
    el.innerHTML = `<div class="v-audio-icon">🎵</div><div style="font-size:14px;color:#9ca3af;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center">${esc(shortName)}</div><audio controls autoplay x-webkit-airplay="allow" style="margin-top:8px;width:260px" src="${esc(f.webPath)}"></audio>`;
  } else {
    el = document.createElement('img');
    el.className = 'v-media';
    el.alt       = f.name;
    el.src       = f.webPath;
    el.onclick   = () => { if (!_liveJustPlayed) viewerNav(1); };
  }

  stage.insertBefore(el, stage.querySelector('.v-zone.left'));

  const oldHint = stage.querySelector('.v-live-hint');
  if (oldHint) oldHint.remove();

  if (!f.isVideo && !f.isAudio && f.liveVideo) {
    setupLivePhoto(el, f.liveVideo, stage);
  }
}

// ── Live Photo press-and-hold ─────────────────────────────────────────────────
let _liveHoldTimer = null;
let _liveJustPlayed = false;

function setupLivePhoto(imgEl, videoUrl, stage) {
  const hint = document.createElement('div');
  hint.className = 'v-live-hint';
  hint.innerHTML = '<span class="dot"></span>Hold for at afspille';
  stage.appendChild(hint);

  let videoEl = null;

  const start = (e) => {
    if (e.cancelable) e.preventDefault();
    _liveHoldTimer = setTimeout(() => {
      videoEl = document.createElement('video');
      videoEl.className   = 'v-media';
      videoEl.autoplay    = true;
      videoEl.loop        = true;
      videoEl.muted       = false;
      videoEl.playsinline = true;
      videoEl.src         = videoUrl;
      imgEl.style.display = 'none';
      hint.classList.add('playing');
      stage.insertBefore(videoEl, stage.querySelector('.v-zone.left'));
      _liveJustPlayed = true;
    }, 220);
  };

  const stop = () => {
    clearTimeout(_liveHoldTimer);
    if (videoEl) {
      videoEl.pause();
      videoEl.remove();
      videoEl = null;
      imgEl.style.display = '';
      hint.classList.remove('playing');
      setTimeout(() => { _liveJustPlayed = false; }, 50);
    }
  };

  imgEl.addEventListener('mousedown', start);
  imgEl.addEventListener('touchstart', start, { passive: false });
  imgEl.addEventListener('mouseup', stop);
  imgEl.addEventListener('mouseleave', stop);
  imgEl.addEventListener('touchend', stop);
  imgEl.addEventListener('touchcancel', stop);
}

function viewerNav(delta) {
  if (!playlist.length) return;
  const stage = document.getElementById('vStage');
  const media = stage.querySelector('video, audio');
  if (media) { media.pause(); media.src = ''; }
  playIdx = ((playIdx + delta) + playlist.length) % playlist.length;
  renderViewer();
}

function onKey(e) {
  if (e.key === 'ArrowRight') viewerNav(1);
  if (e.key === 'ArrowLeft')  viewerNav(-1);
  if (e.key === 'Escape')     closeViewer();
}

// ── Navigation buttons ────────────────────────────────────────────────────────
document.getElementById('btnBack').addEventListener('click', () => {
  if (viewingCollection) {
    viewingCollection = null;
    document.getElementById('folderSection').style.display = '';
    loadBrowse('', galleryDisplayName);
    return;
  }
  loadBrowse(parentRelPath ?? '');
});
document.getElementById('btnGalleries').addEventListener('click', () => loadGalleries());

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getCookie(name) {
  const m = document.cookie.match('(?:^|;)\\s*' + name + '=([^;]*)');
  return m ? decodeURIComponent(m[1]) : null;
}

function tvUrl(webPath) {
  const token = currentGallery ? getCookie('gallery_' + currentGallery) : null;
  return token ? webPath + '?token=' + encodeURIComponent(token) : webPath;
}
</script>
<script>
(function(){
    var vid = localStorage.getItem('_mid');
    if (!vid) { vid = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); localStorage.setItem('_mid', vid); }
    function track(path, title, referrer) {
        fetch('https://stats.itmartin.dk/api/hit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: path, title: title, referrer: referrer, visitorId: vid, host: location.hostname }),
            keepalive: true
        }).catch(function(){});
    }
    track(location.pathname + location.search, document.title, document.referrer);
    document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (!a || !a.href || a.href.startsWith('javascript')) return;
        var href = a.getAttribute('href') || a.href;
        track('click:' + href, a.textContent.trim().slice(0, 80), location.pathname);
    }, true);
})();
</script>
