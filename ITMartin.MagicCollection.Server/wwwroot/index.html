<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d14">
<title>My Collection</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:16px 16px 60px}

.page-title{font-size:26px;font-weight:900;margin-bottom:4px}
.page-sub{font-size:13px;color:#64748b;margin-bottom:20px}

/* Stats */
.stats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:14px 16px;text-align:center}
.stat-value{font-size:22px;font-weight:900}
.stat-label{font-size:11px;color:#64748b;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.stat.highlight .stat-value{color:#22c55e}

/* Alerts */
.alerts{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:14px 16px;margin-bottom:20px}
.alerts-title{font-size:13px;font-weight:700;color:#fbbf24;margin-bottom:10px}
.alert-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #374151}
.alert-row:last-child{border-bottom:none}
.alert-info{flex:1}
.alert-name{font-size:14px;font-weight:600}
.alert-set{font-size:12px;color:#64748b;margin-left:6px}
.alert-prices{display:flex;align-items:center;gap:6px;font-size:13px}
.alert-old{color:#64748b;text-decoration:line-through}
.alert-new{color:#22c55e;font-weight:700}
.alert-delta{color:#22c55e;font-size:11px}
.alert-dismiss{background:none;border:none;color:#64748b;cursor:pointer;font-size:16px;padding:4px}

/* Toolbar */
.toolbar{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:160px;background:#0a0d14;border:1px solid #1f2937;color:#f0f0f0;border-radius:8px;padding:9px 12px;font-size:15px;outline:none}
.search::placeholder{color:#4b5563}
.search:focus{border-color:#3b82f6}
.sort-select{background:#0a0d14;border:1px solid #1f2937;color:#f0f0f0;border-radius:8px;padding:9px 10px;font-size:13px;outline:none;cursor:pointer}

/* Card list */
.card-list{display:flex;flex-direction:column;gap:8px}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px 14px}
.card-info{}
.card-name{font-size:14px;font-weight:700}
.card-meta{font-size:11px;color:#64748b;margin-top:3px}
.card-price{text-align:right;flex-shrink:0}
.card-eur{font-size:15px;font-weight:700;color:#22c55e}
.card-total{font-size:11px;color:#4b5563;margin-top:2px}
.card-na{font-size:14px;color:#374151}

.loading{text-align:center;padding:60px 20px;color:#4b5563;font-size:15px}
.empty{text-align:center;padding:40px 20px;color:#4b5563}
</style>
</head>
<body>

<div class="page-title">My Collection</div>
<div class="page-sub">Card prices &amp; collection value</div>

<div id="alertsPanel" style="display:none">
  <div class="alerts">
    <div class="alerts-title">📈 Price Alerts</div>
    <div id="alertsList"></div>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-value" id="statCards">—</div><div class="stat-label">Unique Cards</div></div>
  <div class="stat"><div class="stat-value" id="statCopies">—</div><div class="stat-label">Total Copies</div></div>
  <div class="stat highlight"><div class="stat-value" id="statValue">—</div><div class="stat-label">Collection Value</div></div>
</div>

<div class="toolbar">
  <input class="search" id="search" type="search" placeholder="Search name or set…" autocomplete="off">
  <select class="sort-select" id="sortBy">
    <option value="value">Highest value</option>
    <option value="name">Name A–Z</option>
    <option value="qty">Most copies</option>
    <option value="recent">Recently scanned</option>
  </select>
</div>

<div id="loading" class="loading">Loading…</div>
<div class="card-list" id="cardList"></div>

<script>
let allCards  = [];
let allAlerts = [];

init();

async function init() {
  const res = await fetch('/api/collection');
  const data = await res.json();
  allCards  = data.cards;
  allAlerts = data.alerts;

  document.getElementById('statCards').textContent  = allCards.length;
  document.getElementById('statCopies').textContent = allCards.reduce((s,c)=>s+c.quantity,0);
  document.getElementById('statValue').textContent  = '€' + data.totalValue.toFixed(2);

  renderAlerts();
  document.getElementById('loading').style.display = 'none';
  renderCards();
}

function renderAlerts() {
  if (!allAlerts.length) return;
  document.getElementById('alertsPanel').style.display = '';
  document.getElementById('alertsList').innerHTML = allAlerts.map(a => `
    <div class="alert-row" id="alert-${a.id}">
      <div class="alert-info">
        <span class="alert-name">${esc(a.cardName)}</span>
        <span class="alert-set">${esc(a.setCode.toUpperCase())}</span>
      </div>
      <div class="alert-prices">
        <span class="alert-old">€${a.oldPrice.toFixed(2)}</span>
        <span>→</span>
        <span class="alert-new">€${a.newPrice.toFixed(2)}</span>
        <span class="alert-delta">+€${a.delta.toFixed(2)}</span>
      </div>
      <button class="alert-dismiss" onclick="dismissAlert('${a.id}')">✕</button>
    </div>`).join('');
}

async function dismissAlert(id) {
  await fetch(`/api/alerts/${id}/dismiss`, { method: 'POST' });
  allAlerts = allAlerts.filter(a => a.id !== id);
  document.getElementById('alertsPanel').style.display = allAlerts.length ? '' : 'none';
  renderAlerts();
}

function renderCards() {
  const q    = document.getElementById('search').value.trim().toLowerCase();
  const sort = document.getElementById('sortBy').value;

  let cards = allCards;
  if (q) cards = cards.filter(c =>
    c.name.toLowerCase().includes(q) || c.setCode.toLowerCase().includes(q));

  cards = [...cards].sort((a,b) => {
    if (sort === 'name')   return a.name.localeCompare(b.name);
    if (sort === 'qty')    return b.quantity - a.quantity;
    if (sort === 'recent') return new Date(b.lastSeenAt) - new Date(a.lastSeenAt);
    return (b.totalEur??0) - (a.totalEur??0);
  });

  const el = document.getElementById('cardList');
  if (!cards.length) {
    el.innerHTML = '<div class="empty">🃏 No cards match.</div>';
    return;
  }
  el.innerHTML = cards.map(c => `
    <div class="card-row">
      <div class="card-info">
        <div class="card-name">${esc(c.name)}</div>
        <div class="card-meta">${esc(c.setCode.toUpperCase())} · #${esc(c.collectorNumber)} · ×${c.quantity} · ${fmtDate(c.lastSeenAt)}</div>
      </div>
      <div class="card-price">
        ${c.eurPrice != null
          ? `<div class="card-eur">€${c.eurPrice.toFixed(2)}</div><div class="card-total">×${c.quantity} = €${c.totalEur.toFixed(2)}</div>`
          : '<div class="card-na">—</div>'}
      </div>
    </div>`).join('');
}

document.getElementById('search').addEventListener('input', renderCards);
document.getElementById('sortBy').addEventListener('change', renderCards);

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
</script>
</body>
</html>
