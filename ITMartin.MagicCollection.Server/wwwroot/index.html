<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d14">
<title>Magic Pris</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:0 0 80px}

/* Header */
.hdr{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.06)}
.hdr-icon{font-size:26px}
.hdr-title{font-size:20px;font-weight:900}
.hdr-sub{font-size:12px;color:#64748b;margin-top:2px}

/* Camera */
.cam-wrap{position:relative;background:#050709;overflow:hidden}
#camVideo{width:100%;max-height:240px;object-fit:cover;display:block}
.cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px}
.cam-btn{background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.3);border-radius:50%;width:60px;height:60px;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.cam-btn:active{background:rgba(255,255,255,.3)}
.cam-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:#64748b;font-size:14px}
.cam-start-icon{font-size:40px}
#camCanvas{display:none}
.snap-preview{width:100%;max-height:200px;object-fit:contain;display:none;background:#050709}

/* Search section */
.search-wrap{padding:14px 16px;display:flex;gap:8px;align-items:center}
.search-input{flex:1;background:#111827;border:1px solid #1f2937;color:#f0f0f0;border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.search-input::placeholder{color:#374151}
.search-input:focus{border-color:#6366f1}
.search-btn{background:#6366f1;border:none;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.search-btn:active{background:#4f46e5}
.search-btn:disabled{background:#1f2937;color:#374151;cursor:default}

/* Result */
.result{padding:0 16px 8px;display:none}
.result-card{background:#111827;border:1px solid #1f2937;border-radius:18px;overflow:hidden}
.result-img-wrap{position:relative;background:#050709;display:flex;justify-content:center;padding:16px}
.result-img{max-height:300px;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.result-rarity{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em}
.rarity-common{background:rgba(100,116,139,.2);color:#94a3b8;border:1px solid rgba(100,116,139,.3)}
.rarity-uncommon{background:rgba(148,163,184,.15);color:#cbd5e1;border:1px solid rgba(148,163,184,.3)}
.rarity-rare{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
.rarity-mythic{background:rgba(251,146,60,.12);color:#fb923c;border:1px solid rgba(251,146,60,.3)}
.result-info{padding:16px 18px}
.result-name{font-size:20px;font-weight:900;margin-bottom:4px}
.result-set{font-size:13px;color:#94a3b8;margin-bottom:14px}
.result-type{font-size:12px;color:#64748b;margin-bottom:14px}
.price-row{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.price-eur{font-size:42px;font-weight:900;color:#22c55e;line-height:1}
.price-eur-label{font-size:12px;color:#64748b;margin-bottom:6px}
.price-usd{font-size:18px;font-weight:700;color:#64748b}
.price-usd-label{font-size:11px;color:#374151;margin-bottom:4px}
.price-foil{font-size:12px;color:#a78bfa;margin-top:4px}
.save-btn{width:100%;background:#22c55e;border:none;color:#fff;font-size:16px;font-weight:800;border-radius:12px;padding:14px;cursor:pointer;letter-spacing:.02em}
.save-btn:active{background:#16a34a}
.save-btn:disabled{background:#1f2937;color:#374151;cursor:default}
.save-ok{text-align:center;color:#22c55e;font-size:14px;font-weight:700;padding:10px 0 0;display:none}

/* Error */
.error-msg{margin:0 16px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:12px 14px;font-size:14px;color:#f87171;display:none}

/* Loading */
.spinner{display:none;text-align:center;padding:24px;color:#64748b;font-size:14px}

/* Saved list */
.saved-section{padding:20px 16px 0}
.saved-header{font-size:13px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.saved-header::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}
.saved-list{display:flex;flex-direction:column;gap:8px}
.saved-row{display:flex;align-items:center;gap:12px;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.saved-row:active{border-color:#6366f1}
.saved-icon{font-size:22px;flex-shrink:0}
.saved-info{flex:1;min-width:0}
.saved-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-meta{font-size:11px;color:#64748b;margin-top:2px}
.saved-price{font-size:16px;font-weight:800;color:#22c55e;flex-shrink:0}
.saved-qty{font-size:11px;color:#64748b;text-align:right;margin-top:2px}
.saved-empty{text-align:center;padding:32px 16px;color:#374151;font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">🃏</div>
  <div>
    <div class="hdr-title">Magic Pris</div>
    <div class="hdr-sub">Slå op og gem kortpriser</div>
  </div>
</div>

<!-- Camera -->
<div class="cam-wrap" id="camWrap">
  <div class="cam-start" id="camStart" onclick="startCamera()">
    <div class="cam-start-icon">📷</div>
    <div>Tryk for at åbne kamera</div>
  </div>
  <video id="camVideo" autoplay playsinline muted style="display:none"></video>
  <canvas id="camCanvas"></canvas>
  <img id="snapPreview" class="snap-preview" alt="">
  <div class="cam-overlay" id="camOverlay" style="display:none">
    <button class="cam-btn" onclick="capture()" title="Tag billede">📸</button>
  </div>
</div>

<!-- Search -->
<div class="search-wrap">
  <input class="search-input" id="searchInput" type="search" placeholder="Kortets navn…" autocomplete="off"
    autocorrect="off" autocapitalize="words">
  <button class="search-btn" id="lookupBtn" onclick="lookup()">Slå op</button>
</div>

<div class="error-msg" id="errorMsg"></div>
<div class="spinner" id="spinner">Henter fra Scryfall…</div>

<!-- Result -->
<div class="result" id="result">
  <div class="result-card">
    <div class="result-img-wrap">
      <img class="result-img" id="resultImg" src="" alt="">
      <span class="result-rarity" id="resultRarity"></span>
    </div>
    <div class="result-info">
      <div class="result-name" id="resultName"></div>
      <div class="result-set"  id="resultSet"></div>
      <div class="result-type" id="resultType"></div>
      <div class="price-row">
        <div>
          <div class="price-eur-label">EUR pris</div>
          <div class="price-eur" id="resultEur">—</div>
          <div class="price-foil" id="resultFoil" style="display:none"></div>
        </div>
        <div>
          <div class="price-usd-label">USD</div>
          <div class="price-usd" id="resultUsd">—</div>
        </div>
      </div>
      <button class="save-btn" id="saveBtn" onclick="save()">💾 Gem kort</button>
      <div class="save-ok" id="saveOk">✓ Gemt!</div>
    </div>
  </div>
</div>

<!-- Saved -->
<div class="saved-section">
  <div class="saved-header">Gemte kort</div>
  <div class="saved-list" id="savedList">
    <div class="saved-empty" id="savedEmpty">Ingen kort gemt endnu</div>
  </div>
</div>

<script>
let currentCard = null;

// ── Camera ──────────────────────────────────────────────────────────────
let stream = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const vid = document.getElementById('camVideo');
    vid.srcObject = stream;
    vid.style.display = 'block';
    document.getElementById('camStart').style.display  = 'none';
    document.getElementById('snapPreview').style.display = 'none';
    document.getElementById('camOverlay').style.display = 'flex';
  } catch (e) {
    document.getElementById('camStart').innerHTML =
      '<div style="font-size:28px">🚫</div><div>Kamera ikke tilgængeligt</div>';
  }
}

function capture() {
  const vid = document.getElementById('camVideo');
  const canvas = document.getElementById('camCanvas');
  canvas.width  = vid.videoWidth;
  canvas.height = vid.videoHeight;
  canvas.getContext('2d').drawImage(vid, 0, 0);

  const preview = document.getElementById('snapPreview');
  preview.src = canvas.toDataURL('image/jpeg', 0.85);
  preview.style.display = 'block';
  vid.style.display = 'none';
  document.getElementById('camOverlay').style.display = 'none';

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

// ── Lookup ───────────────────────────────────────────────────────────────
async function lookup() {
  const name = document.getElementById('searchInput').value.trim();
  if (!name) return;

  setError('');
  document.getElementById('result').style.display  = 'none';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('lookupBtn').disabled    = true;
  document.getElementById('saveOk').style.display  = 'none';
  currentCard = null;

  try {
    const res = await fetch('/api/lookup?name=' + encodeURIComponent(name));
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      setError(err.error ?? 'Kortet blev ikke fundet. Tjek stavning og prøv igen.');
      return;
    }
    const card = await res.json();
    currentCard = card;
    renderResult(card);
  } catch (e) {
    setError('Fejl ved opslag. Er du online?');
  } finally {
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('lookupBtn').disabled    = false;
  }
}

function renderResult(c) {
  document.getElementById('resultImg').src     = c.imageUrl ?? '';
  document.getElementById('resultName').textContent = c.name;
  document.getElementById('resultSet').textContent  =
    (c.setName ?? c.setCode.toUpperCase()) + ' · #' + c.collectorNumber;
  document.getElementById('resultType').textContent = c.typeLine ?? '';

  document.getElementById('resultEur').textContent =
    c.eurPrice != null ? '€' + c.eurPrice.toFixed(2) : '—';
  document.getElementById('resultUsd').textContent =
    c.usdPrice != null ? '$' + c.usdPrice.toFixed(2) : '—';

  const foilEl = document.getElementById('resultFoil');
  if (c.eurFoil != null) {
    foilEl.textContent = 'Foil: €' + c.eurFoil.toFixed(2);
    foilEl.style.display = '';
  } else {
    foilEl.style.display = 'none';
  }

  const rarEl = document.getElementById('resultRarity');
  rarEl.textContent = rarityLabel(c.rarity);
  rarEl.className   = 'result-rarity rarity-' + (c.rarity ?? 'common');

  document.getElementById('saveBtn').disabled  = false;
  document.getElementById('result').style.display = '';
}

// ── Save ─────────────────────────────────────────────────────────────────
async function save() {
  if (!currentCard) return;
  document.getElementById('saveBtn').disabled = true;

  try {
    await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        scryfallId:      currentCard.scryfallId,
        name:            currentCard.name,
        setCode:         currentCard.setCode,
        collectorNumber: currentCard.collectorNumber,
        eurPrice:        currentCard.eurPrice,
        usdPrice:        currentCard.usdPrice,
      })
    });
    document.getElementById('saveOk').style.display = '';
    loadSaved();
  } catch (e) {
    setError('Fejl ved gemning.');
    document.getElementById('saveBtn').disabled = false;
  }
}

// ── Saved list ───────────────────────────────────────────────────────────
async function loadSaved() {
  try {
    const res   = await fetch('/api/saved');
    const cards = await res.json();
    const list  = document.getElementById('savedList');
    const empty = document.getElementById('savedEmpty');

    if (!cards.length) {
      empty.style.display = '';
      list.innerHTML = '';
      list.appendChild(empty);
      return;
    }

    empty.style.display = 'none';
    list.innerHTML = cards.map(c => `
      <div class="saved-row" onclick="fillSearch(${JSON.stringify(c.name)})">
        <div class="saved-icon">🃏</div>
        <div class="saved-info">
          <div class="saved-name">${esc(c.name)}</div>
          <div class="saved-meta">${esc(c.setCode.toUpperCase())} · #${esc(c.collectorNumber)} · ${fmtDate(c.lastSeenAt)}</div>
        </div>
        <div>
          <div class="saved-price">${c.eurPrice != null ? '€'+c.eurPrice.toFixed(2) : '—'}</div>
          <div class="saved-qty">×${c.quantity}</div>
        </div>
      </div>`).join('');
  } catch (e) {}
}

function fillSearch(name) {
  document.getElementById('searchInput').value = name;
  lookup();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Helpers ──────────────────────────────────────────────────────────────
function setError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent    = msg;
  el.style.display  = msg ? '' : 'none';
}

function rarityLabel(r) {
  if (r === 'mythic')   return 'Mythic';
  if (r === 'rare')     return 'Rare';
  if (r === 'uncommon') return 'Uncommon';
  return 'Common';
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('da-DK', { day:'2-digit', month:'short', year:'numeric' });
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookup();
});

loadSaved();
</script>
<script>
(function(){
    var vid = localStorage.getItem('_mid');
    if (!vid) { vid = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); localStorage.setItem('_mid', vid); }
    function track(path, title, referrer) {
        fetch('https://stats.itmartin.dk/api/hit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: path, title: title, referrer: referrer, visitorId: vid, host: location.hostname }),
            keepalive: true
        }).catch(function(){});
    }
    track(location.pathname + location.search, document.title, document.referrer);
    document.addEventListener('click', function(e) {
        var a = e.target.closest('a');
        if (!a || !a.href || a.href.startsWith('javascript')) return;
        var href = a.getAttribute('href') || a.href;
        track('click:' + href, a.textContent.trim().slice(0, 80), location.pathname);
    }, true);
})();
</script>
</body>
</html>
