name: martinsuite

services:

  # =========================================================
  # PORTAL
  # =========================================================

  index-web:
    container_name: index-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartin.IndexServer/Dockerfile

    ports:
      - "8086:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Apps__FileSorterUrl=https://filesorter.itmartin.dk
      - Apps__BudgetUrl=https://budget.itmartin.dk
      - Apps__MagicUrl=https://magic-card-pricing.itmartin.dk
      - Apps__ReceiptUrl=https://kvittering.itmartin.dk
      - Apps__LibraryUrl=https://scan-books.itmartin.dk
      - Apps__LibrarySearchUrl=https://search-books.itmartin.dk
      - Apps__AdhdUrl=https://adhd.itmartin.dk
      - Apps__FamilyUrl=https://idag.itmartin.dk
      - Apps__MarketUrl=https://market.itmartin.dk
      - Apps__BarTabUrl=https://bartab.itmartin.dk
      - Apps__AuctionUrl=https://auction.itmartin.dk
      - Apps__MusikUrl=https://musik.itmartin.dk
      - Apps__ClubUrl=https://lions-club.itmartin.dk
      - Apps__R6ClubUrl=https://r6oldboyz.itmartin.dk
      - Apps__TestHubUrl=https://test.itmartin.dk
      - Apps__GalleryUrl=https://gallery.itmartin.dk
      - Apps__CuratorUrl=https://curator.itmartin.dk
      - Apps__MusikStudioUrl=https://studio.itmartin.dk
      - Apps__MagicCollectionUrl=https://magic-collection.itmartin.dk
      - Apps__MagazineUrl=https://magazine.itmartin.dk
      - Apps__MagazineSearchUrl=https://magazine-search.itmartin.dk
      - Apps__ScanUrl=https://scan.itmartin.dk
      - Apps__R6AssistantUrl=https://r6.itmartin.dk
      - Apps__R6IntelUrl=https://r6intel.itmartin.dk
      - Apps__ImageGenUrl=https://imagegen.itmartin.dk
      - Apps__CloudOverblikUrl=https://cloudoverblik.itmartin.dk
      - Apps__UploadUrl=https://upload.itmartin.dk

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # FILESORTER
  # =========================================================

  filesorter-web:
    container_name: filesorter-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinFileSorter.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8080:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - MediaSettings__SourceRoot=/data
      - MediaSettings__LibraryRoot=/library
      - ConnectionStrings__MediaDb=Data Source=/library/.media.db
      - Apps__GalleryUrl=https://gallery.itmartin.dk
      - Apps__CuratorUrl=https://gallery.itmartin.dk

    volumes:
      - /volume1/docker/filesorter/incoming:/data
      - /volume1/docker/filesorter/library:/library
      - /volume1/docker/filesorter/jobs:/jobs

    restart: unless-stopped

    networks:
      - martinnet

  filesorter-worker:
    container_name: filesorter-worker
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinFileSorter.Worker/Dockerfile

    env_file:
      - magic.env

    environment:
      - MediaSettings__SourceRoot=/data
      - MediaSettings__LibraryRoot=/library
      - ConnectionStrings__MediaDb=Data Source=/library/.media.db

    volumes:
      - /volume1/docker/filesorter/incoming:/data
      - /volume1/docker/filesorter/library:/library
      - /volume1/docker/filesorter/jobs:/jobs

    depends_on:
      - rabbitmq

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # CURATOR  →  library curation tool
  # =========================================================

  curator-web:
    container_name: curator-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartin.Curator.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8091:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - MediaSettings__LibraryRoot=/library

    volumes:
      - /volume1/docker/filesorter/library:/library

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # GALLERY  →  multi-tenant gallery (one container, all galleries)
  # =========================================================

  gallery-web:
    container_name: gallery-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinFileSorter.Gallery.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8092:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Galleries__0__Slug=mie
      - Galleries__0__Name=Mie
      - Galleries__0__Path=/library/mie
      - Galleries__0__Password=8670Låsby
      - Galleries__1__Slug=jespermette
      - Galleries__1__Name=Mette & Jesper
      - Galleries__1__Path=/library/jespermette
      - Galleries__1__Password=2860Søborg

    volumes:
      - /volume1/docker/filesorter/library/mie:/library/mie:ro
      - /volume1/docker/filesorter/library/mettejesper:/library/jespermette:ro

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # BUDGET
  # =========================================================

  budget-web:
    container_name: budget-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinBudget.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8081:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/budget/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # R6 ASSISTANT
  # =========================================================

  r6assistant-web:
    container_name: r6assistant-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinR6Assistant.Server/Dockerfile

    ports:
      - "8082:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/r6assistant/data:/app/Data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # MAGIC
  # =========================================================

  magic-postgres:
    image: postgres:17
    container_name: magic-postgres

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=magic
      - POSTGRES_DB=magic

    volumes:
      - /volume1/docker/martinsuite/magic/postgres:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - martinnet

  magic-web:
    container_name: magic-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartin.Magic.Server/Dockerfile

    ports:
      - "8083:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MagicDb=Host=magic-postgres;Port=5432;Database=magic;Username=postgres;Password=magic
      - Logging__LogLevel__ITMartin=Debug

    volumes:
      - /volume1/docker/martinsuite/magic/data:/app/data

    depends_on:
      - magic-postgres

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # LIBRARY SEARCH (browse & find items)
  # =========================================================

  library-search-web:
    container_name: library-search-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinLibrary.Search.Server/Dockerfile

    ports:
      - "8099:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__LibraryDb=Data Source=/data/library.db

    volumes:
      - /volume1/docker/martinsuite/library/data:/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # MAGIC COLLECTION (read-only collection viewer)
  # =========================================================

  magic-collection-web:
    container_name: magic-collection-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartin.MagicCollection.Server/Dockerfile

    ports:
      - "8098:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MagicDb=Host=magic-postgres;Port=5432;Database=magic;Username=postgres;Password=magic

    depends_on:
      - magic-postgres

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # RECEIPT
  # =========================================================

  receipt-web:
    container_name: receipt-web
    image: receipt-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartin.Receipt.Server/Dockerfile

    ports:
      - "8084:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/receipts.db

    volumes:
      - /volume1/docker/martinsuite/receipt/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # LIBRARY
  # =========================================================

  library-web:
    container_name: library-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartinLibrary.Server/Dockerfile

    ports:
      - "8085:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/library.db
      - Omdb__ApiKey=dc9d07ad

    volumes:
      - /volume1/docker/martinsuite/library/data:/app/data

    deploy:
      resources:
        limits:
          memory: 512m

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # FAMILY PLANNER
  # =========================================================

  family-web:
    container_name: family-web
    image: family-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartinFamily.Server/Dockerfile

    ports:
      - "8088:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/family.db
      - Family__Names=Martin,Vibz,Julius,Eigil,Bertil

    volumes:
      - /volume1/docker/martinsuite/family/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # ADHD — FindIt
  # =========================================================

  adhd-web:
    container_name: adhd-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartinAdhd.Server/Dockerfile

    ports:
      - "8087:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/martinsuite/adhd/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # ON-DEMAND — start manually: docker compose up -d <name>
  # =========================================================

  bartab-web:
    container_name: bartab-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinBarTab.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8095:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__BarTabDb=Data Source=/app/db/bartab.db
      - Concurrency__MaxUsers=10

    volumes:
      - /volume1/docker/martinsuite/bartab/db:/app/db
      - /volume1/docker/martinsuite/bartab/photos:/app/data/photos

    restart: unless-stopped

    networks:
      - martinnet

  auction-web:
    container_name: auction-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinAuction.Server/Dockerfile

    ports:
      - "8096:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AuctionDb=Data Source=/app/db/auction.db

    volumes:
      - /volume1/docker/martinsuite/auction/db:/app/db
      - /volume1/docker/martinsuite/auction/photos:/app/data/photos

    restart: unless-stopped

    networks:
      - martinnet

  market-web:
    container_name: market-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartinMarket.Server/Dockerfile

    ports:
      - "8089:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/market.db

    volumes:
      - /volume1/docker/martinsuite/market/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # IMAGE GENERATOR
  # =========================================================

  imagegen-web:
    container_name: imagegen-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinImageGen.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8107:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ImageStorage__Root=/app/data/images

    volumes:
      - /volume1/docker/martinsuite/imagegen/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # CLOUD OVERBLIK — Public cloud audit wizard + lead capture
  #   cloudoverblik.itmartin.dk  →  http://cloudoverblik-web:8080
  # =========================================================

  cloudoverblik-web:
    container_name: cloudoverblik-web
    image: cloudoverblik-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinCloudOverblik.Server/Dockerfile

    ports:
      - "8108:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CloudDb=Data Source=/app/data/cloud.db
      - CloudAdmin__Pin=sky2025

    volumes:
      - /volume1/docker/martinsuite/cloudoverblik/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # TESTHUB
  # =========================================================

  testhub-web:
    container_name: testhub-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinTestHub.Server/Dockerfile

    ports:
      - "8097:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__TestHubDb=Data Source=/app/db/testhub.db
      - Admin__Pin=272205

    volumes:
      - /volume1/docker/martinsuite/testhub/db:/app/db

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # CLUB — Group organizer (multi-tenant, one container for all clubs)
  #   lions-club.itmartin.dk  →  http://club-web:8080
  #   r6oldboyz.itmartin.dk   →  http://club-web:8080
  # =========================================================

  club-web:
    container_name: club-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinClub.Server/Dockerfile

    ports:
      - "8102:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ClubDb=Data Source=/app/data/club.db
      - ClubSettings__DocsRoot=/app/data/documents

    volumes:
      - /volume1/docker/martinsuite/club/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # MUSIK
  # =========================================================

  musik-web:
    container_name: musik-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinMusic.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8101:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - MusicSettings__Root=/musik
      - MusicSettings__AccessCode=sommer2025
      - ConnectionStrings__MusicDb=Data Source=/app/data/musik.db

    volumes:
      - /volume1/MartinMusik:/musik:ro
      - /volume1/docker/martinsuite/musik/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # MAGAZINE SCANNER
  # =========================================================

  magazine-web:
    container_name: magazine-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinMagazine.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8103:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MagazineDb=Data Source=/app/data/magazine.db
      - MagazineSettings__ImagesRoot=/app/data/images

    volumes:
      - /volume1/docker/martinsuite/magazine/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  magazine-search-web:
    container_name: magazine-search-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinMagazine.Search.Server/Dockerfile

    ports:
      - "8104:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MagazineDb=Data Source=/app/data/magazine.db
      - MagazineSettings__ImagesRoot=/app/data/images

    volumes:
      - /volume1/docker/martinsuite/magazine/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  musik-studio-web:
    container_name: musik-studio-web
    profiles: [manual]

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartinMusikStudio.Server/Dockerfile

    ports:
      - "8105:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__StudioDb=Data Source=/app/data/studio.db
      - StudioSettings__AccessCode=martin
      - StudioSettings__MusicRoot=/musik

    volumes:
      - /volume1/MartinMusik:/musik
      - /volume1/docker/martinsuite/musikstudio/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # R6 INTEL
  # =========================================================

  r6intel-web:
    container_name: r6intel-web
    profiles: [manual]
    build:
      context: .
      dockerfile: ./ITMartinR6Intel.Server/Dockerfile
    ports:
      - "8093:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    restart: unless-stopped
    networks:
      - martinnet

  # =========================================================
  # WORKERS
  # =========================================================

  image-processor:
    container_name: image-processor
    profiles: [manual]
    build: ./ITMartinImageProcessor.Worker

    volumes:
      - /volume1/docker/imageprocessor/input:/data
      - /volume1/docker/imageprocessor/output:/library
      - /volume1/docker/imageprocessor/archive:/archive

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # INFRASTRUCTURE
  # =========================================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit loopback_users []

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # CLOUDFLARE TUNNEL
  # Routes configured at: https://one.dash.cloudflare.com
  #   → Tunnels → your tunnel → Public Hostnames
  #
  # Add one hostname per service:
  #   sort.YOURDOMAIN.com        →  http://filesorter-web:8080
  #   gallery.YOURDOMAIN.com     →  http://gallery-web:8080
  #   budget.YOURDOMAIN.com      →  http://budget-web:8080
  #   magic.YOURDOMAIN.com       →  http://magic-web:8080
  #   receipt.YOURDOMAIN.com     →  http://receipt-web:8080
  #   library.YOURDOMAIN.com     →  http://library-web:8080
  #   martin.YOURDOMAIN.com      →  http://index-web:8080
  #   scan.YOURDOMAIN.com        →  http://scan-web:8080
  # =========================================================

  scan-web:
    container_name: scan-web
    image: martinsuite-scan-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinScan.Server/Dockerfile

    env_file:
      - magic.env

    ports:
      - "8106:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/martinsuite/scan/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  # =========================================================
  # UPLOAD — Customer file upload (drag & drop → NAS folder)
  #   upload.itmartin.dk/upload/{slug}
  # =========================================================

  upload-web:
    container_name: upload-web
    image: upload-web
    profiles: [manual]

    build:
      context: .
      dockerfile: ./ITMartinUpload.Server/Dockerfile

    ports:
      - "8109:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - UploadRoot=/app/data

    volumes:
      - /volume1/docker/martinsuite/upload/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared

    restart: unless-stopped

    command: tunnel run

    env_file:
      - cloudflare.env

    networks:
      - martinnet


networks:
  martinnet:
    driver: bridge
