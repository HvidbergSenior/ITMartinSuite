services:

  filesorter-web:
    container_name: filesorter-web
    build: ./ITMartinFileSorter.Server

    ports:
      - "8080:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/filesorter/incoming:/data
      - /volume1/docker/filesorter/library:/library
      - /volume1/docker/filesorter/config:/config

    restart: unless-stopped

    networks:
      - martinnet

  budget-web:
    container_name: budget-web
    build: ./ITMartinBudget.Server

    ports:
      - "8081:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/budget/data:/app/data

    restart: unless-stopped

    networks:
      - martinnet

  image-processor:
    container_name: image-processor
    build: ./ITMartinImageProcessor.Worker

    volumes:
      - /volume1/docker/imageprocessor/input:/data
      - /volume1/docker/imageprocessor/output:/library
      - /volume1/docker/imageprocessor/archive:/archive

    restart: unless-stopped

    networks:
      - martinnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared

    restart: unless-stopped

    command: tunnel run

    environment:
      - TUNNEL_TOKEN=eyJhIjoiYmE3ODc2MjJmMTlhYzNjZTIzNDk5YzRkZTVjYjVjMDMiLCJ0IjoiZWFhN2EyNTctNDVhMC00ZGUzLTkwZDAtNzMyMjcxOTI2ZmNmIiwicyI6Ik9HTTBZVEF3TlRFdE1XVTBOeTAwTUdRMUxXRmlaR0l0TVRVMk0ySXlaR1ZrTnpCbCJ9
    networks:
      - martinnet

  r6assistant-web:
    container_name: r6assistant-web
    build: ./ITMartinR6Assistant.Server

    ports:
      - "8082:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080

    volumes:
      - /volume1/docker/r6assistant/data:/app/Data

    restart: unless-stopped

    networks:
      - martinnet

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex

    network_mode: host

    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Copenhagen
      - VERSION=docker

    volumes:
      - /volume1/docker/plex/config:/config
      - /volume1/docker/plex/Movies:/movies
      - /volume1/docker/plex/Tv:/tv

    restart: unless-stopped
    
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

    restart: unless-stopped

    networks:
      - martinnet
    
  magic-postgres:
    image: postgres:17
    container_name: magic-postgres

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=magic
      - POSTGRES_DB=magic

    volumes:
      - /volume1/docker/martinsuite/magic/postgres:/var/lib/postgresql/data

    restart: unless-stopped

    networks:
      - martinnet

  magic-web:
    container_name: magic-web

    env_file:
      - magic.env

    build:
      context: .
      dockerfile: ./ITMartin.Magic.Server/Dockerfile

    ports:
      - "8083:8080"

    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MagicDb=Host=magic-postgres;Port=5432;Database=magic;Username=postgres;Password=magic

    volumes:
      - /volume1/docker/martinsuite/magic/data:/app/data

    depends_on:
      - magic-postgres

    restart: unless-stopped

    networks:
      - martinnet

networks:
  martinnet:
    driver: bridge