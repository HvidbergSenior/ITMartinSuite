@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); }
  40%          { transform: translateY(-9px); }
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .4; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
@keyframes planefly {
  0%   { transform: translateX(-30px) rotate(-5deg); opacity:0; }
  20%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translateX(30px) rotate(5deg); opacity:0; }
}

function ProgressBar({ current, total }) {

  return (
    <div style={{ height: 3, background: 'rgba(255,255,255,0.15)' }}>
      <div style={{
        height: '100%',
        width: `${pct}%`,

        borderRadius: '0 2px 2px 0',
      }}/>
    </div>
  );
}

function QuizScreen({ step, answers, onToggle, onNext, onBack }) {
  const q = QUESTIONS[step];
  const sel = answers[q.id] || [];
  const canNext = sel.length > 0;

  return (
    <div style={{ animation: 'fadeUp 0.3s ease', padding: '20px 20px 24px' }}>
      <div style={{ marginBottom: 6 }}>
        <span style={{ fontSize: 11, color: C.gray, textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>
          Spørgsmål {step + 1} af {QUESTIONS.length}
        </span>
      </div>
      <h2 style={{
        fontFamily: 'Playfair Display, serif',
        fontSize: 22,
        fontWeight: 700,
        color: C.navy,
        marginBottom: 6,
        lineHeight: 1.25,
      }}>{q.q}</h2>
      <p style={{ fontSize: 12, color: C.gray, marginBottom: 18 }}>Vælg én eller flere</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 20 }}>
        {q.opts.map(o => (
          <Chip
            key={o.label}
            emoji={o.emoji}
            label={o.label}
            selected={sel.includes(o.label)}
            onClick={() => onToggle(q.id, o.label)}
          />
        ))}
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        {step > 0 && (
          <button onClick={onBack} style={{
            padding: '12px 16px',
            borderRadius: 10,
            border: `1.5px solid ${C.border}`,
            background: 'transparent',
            color: C.gray,
            fontSize: 14,
            cursor: 'pointer',
            fontFamily: 'DM Sans, sans-serif',
          }}>← Tilbage</button>
        )}
        <button onClick={onNext} disabled={!canNext} style={{
          flex: 1,
          padding: '13px 0',
          borderRadius: 10,
          border: 'none',
          background: canNext ? C.blue : C.border,
          color: canNext ? C.white : C.gray,
          fontSize: 15,
          fontWeight: 600,
          cursor: canNext ? 'pointer' : 'default',
          fontFamily: 'DM Sans, sans-serif',
          transition: 'all 0.15s ease',
          boxShadow: canNext ? '0 4px 12px rgba(45,95,166,0.3)' : 'none',
        }}>
          {step < QUESTIONS.length - 1 ? 'Næste →' : 'Find mine rejser ✨'}
        </button>
      </div>
    </div>
  );
}

}

const TAG_OF = {
  'Afslapning og ro':'R','Kultur og seværdigheder':'K','Eventyr og aktiviteter':'E','Fest og natteliv':'F','Natur og stilhed':'N',
  'Strand og hav':'S','Storby og byliv':'B','Bjerge og natur':'M','Hyggelige landsbyer':'L',
  'Klassisk solferie':'C','All Inclusive':'A','Rundrejse':'U','Safari og natur':'Y','Aktiv ferie':'X',
  'Med familie':'f','Med venner':'v','Som par':'p','Alene':'a',
  'Mest afslapning':'R','Meget aktiv':'X',
};
const CLIMATE_OF = { 'Meget varmt 30°C+':'h', 'Mildt og solrigt 22–28°C':'m', 'Tropisk og eksotisk':'t' };
const FLIGHT_OF = { '0–3 timer':1, '3–6 timer':2, 'Lang distance':3 };
const BUDGET_MAX = { 'Under 4.000 kr.':4000, '4.000–8.000 kr.':8000, '8.000–15.000 kr.':15000, 'Ingen grænse':1e9 };

function matchTrips(answers) {
  const picked = id => answers[id] || [];
  const flights = picked('flight').map(l => FLIGHT_OF[l]).filter(Boolean);
  const climates = picked('climate').map(l => CLIMATE_OF[l]).filter(Boolean);
  const budgets = picked('budget').map(l => BUDGET_MAX[l]).filter(Boolean);
  const maxBudget = budgets.length ? Math.max(...budgets) : 1e9;
  const tagAnswers = ['who','goal','dest','type','activity'].flatMap(id => picked(id));

  const scored = TRIPS.map(t => {
    const [name,country,emoji,band,flightTime,price,climate,path,tags,tagline,desc,highlights,travelForm] = t;
    let score = 0; const reasons = [];
    tagAnswers.forEach(label => { const tg = TAG_OF[label]; if (tg && tags.includes(tg)) { score += 2; reasons.push(label.toLowerCase()); } });
    if (climates.length) score += climates.some(c => climate.includes(c)) ? 2 : -1;
    if (flights.length) score += flights.includes(band) ? 3 : -3;
    score += price <= maxBudget ? 2 : -4;
    return { score, reasons, trip: {
      name, country, emoji, tagline,
      description: desc + (reasons.length ? ` Passer til dine ønsker om ${[...new Set(reasons)].slice(0,3).join(', ')}.` : ''),
      highlights, travelForm, flightTime,
      priceFrom: 'ca. ' + price.toLocaleString('da-DK') + ' kr.',
      url: 'https://www.bravotours.dk/rejser/' + (path ? path + '/' : ''),
    }};
  });
  scored.sort((a, b) => b.score - a.score || Math.random() - 0.5);
  return scored.slice(0, 3).map(s => s.trip);
}

/* ─── Main App ─── */
function BravoApp() {
  const STORAGE_KEY = 'bravo_quiz_state';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { return null; } })();

  const [step, setStep] = useState(saved?.step ?? 0);
  const [answers, setAnswers] = useState(saved?.answers ?? {});
  const [phase, setPhase] = useState(() => {
    if (!saved) return 'welcome';
    // Don't restore 'welcome' or 'loading' from storage; map quiz@step0/no-answers back to welcome
    if (saved.phase === 'welcome') return 'welcome';
    if (saved.phase === 'loading') return 'quiz';
    if (saved.phase === 'quiz' && saved.step === 0 && Object.keys(saved.answers || {}).length === 0) return 'welcome';
    return saved.phase ?? 'welcome';
  }); // quiz | loading | results | error
  const [results, setResults] = useState(saved?.results ?? []);
  const [errorMsg, setErrorMsg] = useState('');

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ step, answers, phase, results }));
  }, [step, answers, phase, results]);

  const toggle = (id, val) => {
    setAnswers(prev => {
      const cur = prev[id] || [];
      return { ...prev, [id]: cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val] };
    });
  };

  const next = async () => {
    if (step < QUESTIONS.length - 1) {
      setStep(s => s + 1);
    } else {
      setPhase('loading');
      try {
        await new Promise(r => setTimeout(r, 2200));
        const trips = matchTrips(answers);
        if (!trips.length) throw new Error('Ingen forslag fundet');
        setResults(trips);
        setPhase('results');
      } catch (e) {
        setErrorMsg(e.message || 'Kunne ikke generere forslag. Prøv igen.');
        setPhase('error');
      }
    }
  };

  const reset = () => {
    setStep(0); setAnswers({}); setPhase('welcome'); setResults([]);
    localStorage.removeItem(STORAGE_KEY);
  };

  const innerContent = (
    <div style={{
      width: '100%',
      height: '100%',
      overflowY: 'auto',
      background: C.bg,
    }}>
      {/* Header — hidden on welcome */}
      {phase !== 'welcome' && <div style={{ background: C.navy, position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{
          padding: '12px 20px 10px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <div>
            <div style={{
              fontFamily: 'Playfair Display, serif',
              color: C.gold, fontSize: 18, fontWeight: 700, letterSpacing: 0.3,
            }}>BRAVO TOURS</div>
            <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', letterSpacing: 0.3 }}>Med jer hele vejen</div>
          </div>
          {phase === 'quiz' && (
            <div style={{
              background: 'rgba(255,255,255,0.1)',
              borderRadius: 20, padding: '4px 12px',
              fontSize: 12, color: 'rgba(255,255,255,0.7)',
              fontWeight: 600,
            }}>
              {step + 1} / {QUESTIONS.length}
            </div>
          )}
          {phase === 'results' && (
            <button onClick={reset} style={{
              background: 'transparent', border: '1px solid rgba(255,255,255,0.3)',
              borderRadius: 20, padding: '4px 12px',
              fontSize: 11, color: 'rgba(255,255,255,0.6)',
              cursor: 'pointer', fontFamily: 'DM Sans, sans-serif',
            }}>↺ Start forfra</button>
          )}
        </div>
        {phase === 'quiz' && <ProgressBar current={step + 1} total={QUESTIONS.length} />}
        {phase === 'loading' && (
          <div style={{ height: 3, background: 'rgba(255,255,255,0.15)', overflow: 'hidden' }}>
            <div style={{
              height: '100%', width: '40%',
              background: C.gold,
              animation: 'shimmer 1.5s ease infinite',
              backgroundImage: `linear-gradient(90deg, ${C.gold} 0%, #f0c96a 50%, ${C.gold} 100%)`,
              backgroundSize: '400px 100%',
            }}/>
          </div>
        )}
      </div>}

      {/* Content */}
      <div style={{ maxWidth: 440, margin: '0 auto' }}>
        {phase === 'welcome' && <WelcomeScreen onStart={() => setPhase('quiz')} />}
        {phase === 'quiz'    && <QuizScreen step={step} answers={answers} onToggle={toggle} onNext={next} onBack={() => setStep(s => s - 1)} />}
        {phase === 'loading' && <LoadingScreen answers={answers} />}
        {phase === 'results' && <ResultsScreen results={results} onReset={reset} />}
        {phase === 'error'   && <ErrorScreen message={errorMsg} onRetry={() => setPhase('quiz')} />}
      </div>
    </div>
  );

  const demoBanner = (
    <div style={{ background: '#fff4d6', color: '#5a4300', fontSize: 11, lineHeight: 1.4, padding: '6px 12px', textAlign: 'center', fontFamily: 'DM Sans, sans-serif' }}>
      Demo lavet af unge med hjælp fra ITMartin – ikke Bravo Tours' officielle side. Priserne er cirka-priser.
    </div>
  );

  if (window.innerWidth < 600) {
    return (
      <div style={{ position: 'fixed', inset: 0, display: 'flex', flexDirection: 'column', background: C.bg }}>
        {demoBanner}
        <div style={{ flex: 1, minHeight: 0 }}>{innerContent}</div>
      </div>
    );
  }

  return (
    <ChromeWindow
      tabs={[{ title: 'Bravo Tours – Find din rejse' }]}
      url="www.bravotours.dk/rejsegenerator"
      width={520}
      height={720}
    >
      {demoBanner}
      {innerContent}
    </ChromeWindow>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BravoApp/>);
</script>
<div id="root"></div>
</body>
