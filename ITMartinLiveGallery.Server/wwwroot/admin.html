<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live-galleri — admin</title>
<link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div class="wrap">
    <h1>Live-galleri</h1>

    <div id="gate" class="card">
      <p>Adgangskode</p>
      <input type="password" id="tokenInput" placeholder="Admin-token" />
      <button onclick="unlock()">Log ind</button>
    </div>

    <div id="app" style="display:none">
      <div class="card">
        <h2>Nyt event</h2>
        <input type="text" id="slugInput" placeholder="Slug (fx mette-bryllup)" />
        <input type="text" id="pinInput" placeholder="Pin (fx 4 cifre guests skal have)" />
        <input type="text" id="titleInput" placeholder="Titel (fx Mette &amp; Jonas' bryllup)" />
        <button onclick="createEvent()">Opret</button>
        <p id="createStatus" class="status"></p>
      </div>

      <div class="card">
        <h2>Events</h2>
        <div id="eventList"></div>
      </div>
    </div>
  </div>
  <script src="/admin.js"></script>
  <footer style="text-align:center;padding:.6rem 1rem;font-size:.72rem;color:#64748b;border-top:1px solid rgba(255,255,255,.06)"><a href="https://all-apps.itmartin.dk/vilkaar" target="_blank" style="color:#64748b;text-decoration:underline">Vilkår &amp; Privatlivspolitik</a> · &copy; <span id="itm-footer-year"></span> ITMartin - Den digitale kolibri</footer>
  <script>document.getElementById('itm-footer-year').textContent = new Date().getFullYear();</script>
</body>
</html>
