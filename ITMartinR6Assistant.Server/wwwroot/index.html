<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d14">
<title>R6 Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:20px 16px 60px}

.hdr{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.back-btn{background:#1f2937;border:none;color:#9ca3af;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;display:none}
.back-btn:hover{color:#f0f0f0}
.hdr-title{font-size:22px;font-weight:900}
.hdr-sub{font-size:13px;color:#64748b;margin-top:2px}

/* Map grid */
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.map-card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer;transition:border-color .15s}
.map-card:hover{border-color:#3b82f6}
.map-card:active{border-color:#2563eb}
.map-name{font-size:16px;font-weight:800}

/* Site cards */
.sites{display:flex;flex-direction:column;gap:14px}
.site-card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px 18px}
.site-name{font-size:17px;font-weight:800;margin-bottom:14px}
.ops-section{margin-bottom:12px}
.ops-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.ops-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:600}
.chip-attack{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.25)}
.chip-defend{background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2)}
.chip-ban{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.site-notes{font-size:13px;color:#64748b;margin-top:12px;padding:10px 12px;background:#0a0d14;border-radius:8px;line-height:1.5}

.loading{text-align:center;padding:60px 20px;color:#4b5563}
</style>
</head>
<body>

<div class="hdr">
  <button class="back-btn" id="backBtn" onclick="showMaps()">← Maps</button>
  <div>
    <div class="hdr-title" id="hdrTitle">R6 Assistant</div>
    <div class="hdr-sub" id="hdrSub">Select a map</div>
  </div>
</div>

<div id="mapView">
  <div id="loading" class="loading">Loading maps…</div>
  <div class="map-grid" id="mapGrid"></div>
</div>

<div id="siteView" style="display:none">
  <div class="sites" id="siteList"></div>
</div>

<script>
let maps = [];

init();

async function init() {
  const res = await fetch('/api/maps');
  maps = await res.json();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('mapGrid').innerHTML = maps.map(m => `
    <div class="map-card" onclick="loadMap('${esc(m)}')">
      <div class="map-name">${esc(m)}</div>
    </div>`).join('');
}

async function loadMap(name) {
  document.getElementById('mapView').style.display   = 'none';
  document.getElementById('siteView').style.display  = '';
  document.getElementById('backBtn').style.display    = '';
  document.getElementById('hdrTitle').textContent     = name;
  document.getElementById('hdrSub').textContent       = 'Site recommendations';
  document.getElementById('siteList').innerHTML       = '<div class="loading">Loading…</div>';

  const res   = await fetch(`/api/maps/${encodeURIComponent(name)}`);
  const sites = await res.json();

  document.getElementById('siteList').innerHTML = sites.map(s => `
    <div class="site-card">
      <div class="site-name">${esc(s.siteName)}</div>
      ${s.attackers.length ? `
        <div class="ops-section">
          <div class="ops-label">Attackers</div>
          <div class="ops-chips">${s.attackers.map(o=>`<span class="chip chip-attack">${esc(o)}</span>`).join('')}</div>
        </div>` : ''}
      ${s.defenders.length ? `
        <div class="ops-section">
          <div class="ops-label">Defenders</div>
          <div class="ops-chips">${s.defenders.map(o=>`<span class="chip chip-defend">${esc(o)}</span>`).join('')}</div>
        </div>` : ''}
      ${s.bans.length ? `
        <div class="ops-section">
          <div class="ops-label">Recommended Bans</div>
          <div class="ops-chips">${s.bans.map(o=>`<span class="chip chip-ban">${esc(o)}</span>`).join('')}</div>
        </div>` : ''}
      ${s.notes ? `<div class="site-notes">${esc(s.notes)}</div>` : ''}
    </div>`).join('');
}

function showMaps() {
  document.getElementById('mapView').style.display   = '';
  document.getElementById('siteView').style.display  = 'none';
  document.getElementById('backBtn').style.display   = 'none';
  document.getElementById('hdrTitle').textContent    = 'R6 Assistant';
  document.getElementById('hdrSub').textContent      = 'Select a map';
}

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
