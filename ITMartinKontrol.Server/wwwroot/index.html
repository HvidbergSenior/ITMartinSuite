<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontrol – ITMartin</title>
<style>
:root{--bg:#0a0d14;--card:#121826;--line:rgba(255,255,255,.1);--fg:#e2e8f0;--muted:#64748b;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.app{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.name{font-weight:700;flex:1 1 auto}
.name small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.status{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{border-color:#22c55e;color:var(--green)}
.status.missing{border-color:#f59e0b;color:#fbbf24}
button{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:wait}
button.start{border-color:#22c55e;color:var(--green)}
button.stop{border-color:#ef4444;color:var(--red)}
a.open{font-size:12px;font-weight:700;color:#0a0d14;background:var(--blue);padding:8px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}
a.open.disabled{background:rgba(255,255,255,.06);color:var(--muted);pointer-events:none}
.msg{color:var(--muted);font-size:13px;min-height:18px;margin-top:8px}
.foot{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>⏻ Kontrol</h1>
  <div class="sub">Tænd og sluk apps. Du bliver bedt om PIN første gang.</div>
  <div id="apps"></div>
  <div class="msg" id="msg"></div>
  <div class="foot">ITMartin Suite · <a href="#" id="forget">Glem PIN</a></div>
</div>
<script>
// Friendly names + public URL per container. Containers not listed here
// still show up, just with their raw name and no "Åbn" link.
var META = {
  "star-realms-web":   { name: "Star Realms Pointtæller", desc: "Live multiplayer-pointtæller til kortspil", url: "https://starrealms.itmartin.dk" },
  "magic-web":         { name: "Pricing Magic",           desc: "Magic-kort prissætning",                 url: "https://pricing-magic.itmartin.dk" },
  "cloudoverblik-web": { name: "Cloud Overblik",          desc: "Cloud-audit wizard",                     url: "https://cloudoverblik.itmartin.dk" }
};
var PIN_KEY = "kontrolPin";
var msg = document.getElementById("msg");

function getPin() {
  var pin = null;
  try { pin = localStorage.getItem(PIN_KEY); } catch (e) {}
  if (!pin) {
    pin = window.prompt("Indtast PIN");
    if (!pin) return null;
    try { localStorage.setItem(PIN_KEY, pin); } catch (e) {}
  }
  return pin;
}
function forgetPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }
document.getElementById("forget").addEventListener("click", function (e) { e.preventDefault(); forgetPin(); msg.textContent = "PIN glemt."; });

function render(apps) {
  var root = document.getElementById("apps");
  root.innerHTML = "";
  apps.forEach(function (a) {
    var m = META[a.name] || { name: a.name, desc: "", url: null };
    var el = document.createElement("div");
    el.className = "app";
    var live = a.running;
    var statusText = !a.exists ? "⚠ Ikke installeret" : live ? "🟢 Kører" : "⚫ Slukket";
    var statusCls = !a.exists ? "status missing" : live ? "status live" : "status";
    el.innerHTML =
      '<div class="name">' + m.name + '<small>' + m.desc + '</small></div>' +
      '<span class="' + statusCls + '">' + statusText + '</span>' +
      (a.exists ? '<button class="' + (live ? "stop" : "start") + '">' + (live ? "⏻ Sluk" : "⏻ Tænd") + '</button>' : '') +
      (m.url ? '<a class="open' + (live ? "" : " disabled") + '" href="' + m.url + '" target="_blank" rel="noopener">Åbn →</a>' : '');
    var btn = el.querySelector("button");
    if (btn) btn.addEventListener("click", function () { power(a.name, live ? "stop" : "start", btn); });
    root.appendChild(el);
  });
}

function refresh() {
  return fetch("/api/apps").then(function (r) { return r.json(); }).then(render)
    .catch(function () { msg.textContent = "Kunne ikke hente status."; });
}

function power(name, action, btn) {
  var pin = getPin();
  if (!pin) return;
  btn.disabled = true;
  btn.textContent = action === "start" ? "Starter…" : "Slukker…";
  msg.textContent = "";
  fetch("/api/apps/" + name + "/" + action, { method: "POST", headers: { "X-Kontrol-Pin": pin } })
    .then(function (r) {
      if (r.status === 401) { forgetPin(); msg.textContent = "Forkert PIN – prøv igen."; return; }
      if (!r.ok) msg.textContent = "Det lykkedes ikke (" + r.status + ").";
      else msg.textContent = action === "start" ? "Startet – appen er klar om et øjeblik." : "Slukket.";
    })
    .catch(function () { msg.textContent = "Kunne ikke nå serveren."; })
    .then(function () { return new Promise(function (res) { setTimeout(res, 1500); }); })
    .then(refresh);
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
