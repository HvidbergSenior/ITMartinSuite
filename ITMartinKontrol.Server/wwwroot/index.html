<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontrol – ITMartin</title>
<style>
:root{--bg:#0a0d14;--card:#121826;--line:rgba(255,255,255,.1);--fg:#e2e8f0;--muted:#64748b;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--amber:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.host{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.host h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.host h2 small{color:var(--muted);font-weight:400;font-size:12px}
.err{color:var(--amber);font-size:13px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.meter{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.meter .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.meter .v small{font-size:11px;color:var(--muted);font-weight:400}
.bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar i.hot{background:var(--red)}.bar i.warm{background:var(--amber)}
.chart{width:100%;height:90px;display:block;margin:4px 0 10px}
.legend{font-size:11px;color:var(--muted);display:flex;gap:14px;margin-bottom:8px}
.legend b{display:inline-block;width:10px;height:3px;vertical-align:middle;margin-right:4px}
.filters{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.filters button{font-size:12px;padding:5px 10px}
.filters button.on{background:rgba(96,165,250,.15);border-color:var(--blue);color:var(--blue)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.app.off{opacity:.55}
.name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{display:block;color:var(--muted);font-weight:400;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.use{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.3}
.use .mini{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:2px}
.use .mini i{display:block;height:100%;background:var(--blue)}
.spark{width:110px;height:18px;display:block}
.btns{display:flex;gap:6px}
button{font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:wait}
button.start{border-color:#22c55e;color:var(--green)}
button.stop{border-color:#ef4444;color:var(--red)}
button.restart{color:var(--muted)}
.lock{color:var(--muted);font-size:11px}
.msg{color:var(--muted);font-size:13px;min-height:18px;margin-top:8px}
.foot{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
.foot a{color:var(--muted)}
@media (max-width:520px){.app{grid-template-columns:minmax(0,1fr) auto}.use{display:none}}

.klist { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
.kapp { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border,#2a2d3d); border-radius:10px; background:rgba(255,255,255,.03); }
.kapp .dot { width:12px; height:12px; border-radius:50%; flex:none; background:#64748b; }
.kapp.ok .dot { background:#22c55e; } .kapp.bad .dot { background:#ef4444; } .kapp.warn .dot { background:#f59e0b; }
.kapp .kn { font-weight:600; } .kapp small { display:block; color:#8890a6; font-size:.75rem; }
.kapp a { color:inherit; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⏻ Kontrol</h1>
  <div class="sub">Alle containere på NAS og photoserver. Tænd, sluk, genstart – PIN første gang. Forbrug samples hvert minut, 48 timer tilbage.</div>
  <div class="filters"><button id="fAll" class="on">Alle</button><button id="fRun">Kun kørende</button><button id="bell" title="Push-alarmer til denne telefon">🔔 Alarmer</button><span class="lock" id="stamp"></span></div>
  <div class="host" id="kolibri"><h2>🐦 Kolibri-apps <small id="kstamp"></small></h2><div id="kolibriList" class="klist"></div></div>
<div id="hosts"></div>
  <div class="msg" id="msg"></div>
  <div class="foot">ITMartin Suite · <a href="#" id="forget">Glem PIN</a></div>
</div>
<script>
var PIN_KEY = "kontrolPin", msg = document.getElementById("msg"), onlyRunning = false, lastData = null;
try { onlyRunning = localStorage.getItem("kontrolOnlyRunning") === "1"; } catch (e) {}

function getPin() {
  var pin = null;
  try { pin = localStorage.getItem(PIN_KEY); } catch (e) {}
  if (!pin) { pin = window.prompt("Indtast PIN"); if (!pin) return null; try { localStorage.setItem(PIN_KEY, pin); } catch (e) {} }
  return pin;
}
function forgetPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }
document.getElementById("forget").addEventListener("click", function (e) { e.preventDefault(); forgetPin(); msg.textContent = "PIN glemt."; });
document.getElementById("fAll").addEventListener("click", function () { setFilter(false); });
document.getElementById("fRun").addEventListener("click", function () { setFilter(true); });
function setFilter(v) { onlyRunning = v; try { localStorage.setItem("kontrolOnlyRunning", v ? "1" : "0"); } catch (e) {} if (lastData) render(lastData); }

function pct(a, b) { return b > 0 ? Math.min(100, Math.round(a / b * 100)) : 0; }
function heat(p) { return p >= 85 ? "hot" : p >= 60 ? "warm" : ""; }
function fmt(n, d) { return (n || 0).toLocaleString("da-DK", { maximumFractionDigits: d == null ? 0 : d }); }

// Two-line chart (CPU % and RAM %) over the history, SVG, no library.
function chart(h, memTotal) {
  var n = h.t.length; if (n < 2) return '<div class="lock">Samler data…</div>';
  var W = 800, H = 90, cpu = "", mem = "";
  for (var i = 0; i < n; i++) {
    var x = (i / (n - 1) * W).toFixed(1);
    cpu += (i ? "L" : "M") + x + " " + (H - Math.min(100, h.cpu[i]) / 100 * H).toFixed(1);
    mem += (i ? "L" : "M") + x + " " + (H - pct(h.mem[i], memTotal) / 100 * H).toFixed(1);
  }
  var from = new Date(h.t[0]), to = new Date(h.t[n - 1]);
  var hrs = Math.round((to - from) / 36e5);
  return '<div class="legend"><span><b style="background:var(--blue)"></b>CPU %</span><span><b style="background:var(--green)"></b>RAM %</span><span>' + hrs + ' t · ' + n + ' målinger</span></div>' +
    '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
    '<line x1="0" y1="' + H / 2 + '" x2="' + W + '" y2="' + H / 2 + '" stroke="rgba(255,255,255,.08)"/>' +
    '<path d="' + cpu + '" fill="none" stroke="var(--blue)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>' +
    '<path d="' + mem + '" fill="none" stroke="var(--green)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
}
function spark(arr) {
  var n = arr.length; if (n < 2) return "";
  var max = Math.max(5, Math.max.apply(null, arr)), d = "";
  for (var i = 0; i < n; i++) d += (i ? "L" : "M") + (i / (n - 1) * 110).toFixed(1) + " " + (18 - arr[i] / max * 17).toFixed(1);
  return '<svg class="spark" viewBox="0 0 110 18" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="var(--blue)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>';
}

function render(hosts) {
  lastData = hosts;
  document.getElementById("fAll").className = onlyRunning ? "" : "on";
  document.getElementById("fRun").className = onlyRunning ? "on" : "";
  var root = document.getElementById("hosts"); root.innerHTML = "";
  hosts.forEach(function (h) {
    var el = document.createElement("div"); el.className = "host";
    var u = h.host, running = h.containers.filter(function (c) { return c.running; }).length;
    var html = '<h2>🖥 ' + h.name + ' <small>' + running + ' af ' + h.containers.length + ' kører' + (u.source === "docker" ? " · værtstal = sum af containere" : "") + '</small></h2>';
    if (h.error) html += '<div class="err">Ingen kontakt: ' + h.error + '</div>';
    else {
      var mp = pct(u.memUsedMb, u.memTotalMb), dp = pct(u.diskUsedGb, u.diskTotalGb);
      html += '<div class="meters">' +
        '<div class="meter"><div class="k">CPU</div><div class="v">' + fmt(u.cpuPct, 0) + ' %</div><div class="bar"><i class="' + heat(u.cpuPct) + '" style="width:' + Math.min(100, u.cpuPct) + '%"></i></div></div>' +
        '<div class="meter"><div class="k">RAM</div><div class="v">' + fmt(u.memUsedMb / 1024, 1) + ' <small>/ ' + fmt(u.memTotalMb / 1024, 1) + ' GB</small></div><div class="bar"><i class="' + heat(mp) + '" style="width:' + mp + '%"></i></div></div>' +
        (u.diskTotalGb > 0 ? '<div class="meter"><div class="k">Disk</div><div class="v">' + fmt(u.diskUsedGb, 0) + ' <small>/ ' + fmt(u.diskTotalGb, 0) + ' GB</small></div><div class="bar"><i class="' + heat(dp) + '" style="width:' + dp + '%"></i></div></div>' : '') +
        '</div>' + chart(h.history, u.memTotalMb);
    }
    var list = h.containers.filter(function (c) { return !onlyRunning || c.running; });
    list.forEach(function (c) {
      var row = document.createElement("div"); row.className = "app" + (c.running ? "" : " off");
      row.innerHTML =
        '<div class="name">' + c.name + '<small>' + c.status + (c.ports ? ' · :' + c.ports : '') + '</small></div>' +
        '<div class="use">' + (c.running ? fmt(c.cpuPct, 1) + ' % · ' + fmt(c.memMb, 0) + ' MB<div class="mini"><i style="width:' + Math.min(100, c.cpuPct || 0) + '%"></i></div>' + spark(c.cpuHistory) : '') + '</div>' +
        '<div class="btns">' +
        (c.running
          ? (c.protected ? '<span class="lock">🔒 beskyttet</span>' : '<button class="restart">↻</button><button class="stop">⏻ Sluk</button>')
          : '<button class="start">⏻ Tænd</button>') + '</div>';
      row.querySelectorAll("button").forEach(function (b) {
        var action = b.classList.contains("stop") ? "stop" : b.classList.contains("start") ? "start" : "restart";
        b.addEventListener("click", function () { power(h.name, c.name, action, b); });
      });
      el.appendChild(row);
    });
    root.appendChild(el);
  });
  document.getElementById("stamp").textContent = "opdateret " + new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
}

function fmtUp(s) { if (s == null) return ""; if (s < 3600) return Math.round(s / 60) + " min"; if (s < 86400) return Math.round(s / 3600) + " t"; return Math.round(s / 86400) + " d"; }
function renderKolibri(items) {
  var root = document.getElementById("kolibriList"); root.innerHTML = "";
  var bad = 0;
  items.forEach(function (a) {
    var cls = a.ok ? (a.speaksKolibri ? "ok" : "warn") : "bad"; if (!a.ok) bad++;
    var sub = a.ok
      ? (a.speaksKolibri ? (a.kolibri || "") + (a.version ? " · v" + a.version : "") + (a.uptimeSeconds != null ? " · oppe " + fmtUp(a.uptimeSeconds) : "") : "svarer, men uden /health-data")
      : (a.error || ("HTTP " + a.http));
    root.innerHTML += '<div class="kapp ' + cls + '"><span class="dot"></span><div><a href="' + a.url + '" target="_blank" class="kn">' + a.name + '</a><small>' + sub + ' · ' + a.latencyMs + ' ms</small></div></div>';
  });
  document.getElementById("kstamp").textContent = bad ? bad + " nede" : "alle oppe";
}
function refreshKolibri() {
  return fetch("/api/kolibri").then(function (r) { return r.json(); }).then(renderKolibri).catch(function () {});
}
function refresh() {
  refreshKolibri();
  return fetch("/api/hosts").then(function (r) { return r.json(); }).then(render)
    .catch(function () { msg.textContent = "Kunne ikke hente status."; });
}

function power(host, name, action, btn) {
  var pin = getPin(); if (!pin) return;
  btn.disabled = true; btn.textContent = action === "start" ? "Starter…" : action === "stop" ? "Slukker…" : "Genstarter…";
  msg.textContent = "";
  fetch("/api/hosts/" + encodeURIComponent(host) + "/apps/" + encodeURIComponent(name) + "/" + action, { method: "POST", headers: { "X-Kontrol-Pin": pin } })
    .then(function (r) {
      if (r.status === 401) { forgetPin(); msg.textContent = "Forkert PIN – prøv igen."; return; }
      if (!r.ok) return r.text().then(function (t) { msg.textContent = "Det lykkedes ikke (" + r.status + "). " + t.slice(0, 160); });
      msg.textContent = name + ": " + (action === "start" ? "startet." : action === "stop" ? "slukket." : "genstartet.");
    })
    .catch(function () { msg.textContent = "Kunne ikke nå serveren."; })
    .then(function () { return new Promise(function (res) { setTimeout(res, 1500); }); })
    .then(refresh);
}

refresh();
setInterval(refresh, 20000);
</script>
<script src="/push.js"></script>
<script>
(function () {
  var bell = document.getElementById("bell");
  function paint(st) { bell.textContent = st === "on" ? "🔔 Alarmer: til" : st === "denied" ? "🔕 Alarmer blokeret" : st === "unsupported" ? "🔕 Ingen push her" : "🔔 Alarmer: fra"; bell.className = st === "on" ? "on" : ""; }
  kpush.state().then(paint);
  bell.addEventListener("click", async function () {
    var st = await kpush.state();
    if (st === "on") { paint(await kpush.unsubscribe()); msg.textContent = "Alarmer slået fra på denne telefon."; return; }
    var pin = getPin(); if (!pin) return;
    var r = await kpush.subscribe(pin);
    if (r === "pin") { forgetPin(); msg.textContent = "Forkert PIN – prøv igen."; return; }
    paint(r);
    if (r === "on") { msg.textContent = "Alarmer slået til. Sender en test…"; await kpush.test(pin); }
  });
})();
</script>
</body>
</html>
